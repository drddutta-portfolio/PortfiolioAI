name: PortfolioAI Architecture Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enforce presentation data boundaries
        run: npm run check:architecture
      - name: Verify canonical authority contracts
        run: npx vitest run src/contracts/canonicalDataAuthorities.test.ts src/features/research/sectorResearchMapping.test.ts src/features/research/researchProfileRouting.test.ts src/features/research/portfolioCoverageProjection.test.ts src/features/research/pharmaResearchProfile.test.ts src/features/research/pharmaSourceReadiness.test.ts src/features/research/pharmaHistoricalSourceContracts.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint architecture boundary
        run: npm run lint:architecture
      - name: Full repository lint diagnostic
        continue-on-error: true
        run: npm run lint
      - name: Production build
        run: npm run build

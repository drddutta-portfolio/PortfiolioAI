name: Banking V1-4 KVB FY26 Source Capture
on:
  pull_request:
    paths:
      - "scripts/banking-v14-kvb-fy26-original-schedules.mjs"
      - ".github/workflows/banking-v14-kvb-fy26-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-kvb-original:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch original KVB schedules and SHA256
        run: node scripts/banking-v14-kvb-fy26-original-schedules.mjs
      - name: Upload original source bytes and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banking-v14-kvb-fy26-original-schedules
          path: kvb-fy26-original-artifact/
          retention-days: 90
          if-no-files-found: error

name: Banking V1-4 KVB R2 PIT Extraction
on:
  pull_request:
    paths:
      - "scripts/v1-4/kvb_r2_pit_extract.py"
      - ".github/workflows/banking-v14-kvb-r2-pit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source syntax and fail-closed boundaries
        run: |
          python -m py_compile scripts/v1-4/kvb_r2_pit_extract.py
          python - <<'PY'
          from pathlib import Path
          s=Path("scripts/v1-4/kvb_r2_pit_extract.py").read_text()
          assert 'pe_pit_admitted":False' in s and 'pb_pit_admitted":False' in s
          assert 'ORIGINAL_AVAILABILITY_NOT_PROVEN' in s
          assert 'put_object(' not in s and 'delete_object(' not in s
          PY
  extract:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.number == 124 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/banking-source-remediation')
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: PortfolioAI-Development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore independently reviewed, immutable extractor from prior commit
        run: |
          git show 03cf0c85916ce32c7f4e5c734349eb13b5505d75:scripts/v1-4/kvb_r2_pit_extract.py > /tmp/kvb_pit_reviewed.py
          python -m py_compile /tmp/kvb_pit_reviewed.py
      - name: Install pinned R2 archive readers
        run: pip install boto3==1.35.99 pyarrow==19.0.1
      - name: Extract KVB 2023–2026 archived month-end candidates
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ced17d24f4b380721e58a08c9e9273e4
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python /tmp/kvb_pit_reviewed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvb-r2-monthly-pit-candidates
          path: kvb-pit-extract-artifact/
          retention-days: 90
          if-no-files-found: warn

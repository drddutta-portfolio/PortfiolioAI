name: KVB Valuation Genuine Owner Source Bundle
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [VERIFY_STORED, PREPARE]
        default: VERIFY_STORED
        description: Read-only verification of retained qualified sources, or explicit source preparation
  push:
    branches: [codex/banking-source-remediation]
    paths:
      - .github/workflows/banking-v14-kvb-valuation-owner-bundle.yml
      - scripts/v1-4/kvb_valuation_owner_bundle.py
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: PortfolioAI-Development
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3==1.35.99
      - name: Verify raw archive transport regressions before credentialed execution
        run: python scripts/v1-4/test_kvb_pb_raw_archive_receipts.py
      - name: Verify retained originals and the qualified source batch
        env:
          KVB_SOURCE_MODE: ${{ inputs.mode || 'VERIFY_STORED' }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: python scripts/v1-4/kvb_valuation_owner_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: kvb-pb-pe-qualified-owner-source-bundle
          path: kvb-valuation-bundle-result/
          retention-days: 90
          if-no-files-found: error

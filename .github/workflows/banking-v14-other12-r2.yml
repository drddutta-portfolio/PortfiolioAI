name: Banking V1-4 Other 12 Shared R2 Extraction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    if: github.ref == 'refs/heads/codex/banking-source-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: PortfolioAI-Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/v1-4 -p 'test_bank_other12_r2_extract.py'
      - run: pip install boto3==1.35.99 pyarrow==19.0.1
      - name: Reuse 36 shared Development archive partitions for 12 banks
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ced17d24f4b380721e58a08c9e9273e4
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python scripts/v1-4/bank_other12_r2_extract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bank-other12-shared-archive-extraction
          path: bank-other12-r2-extraction/
          retention-days: 90
          if-no-files-found: error

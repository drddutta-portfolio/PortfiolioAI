name: Banking V1-4 Twelve Bank Pinned Growth Admission
on:
  push:
    branches: [codex/banking-twelve-evidence]
    paths:
      - '.github/workflows/banking-v14-twelve-growth.yml'
      - 'scripts/v1-4/bank_twelve_growth_execute.py'
      - 'supabase/functions/_shared/v14-bank-twelve-growth-*'
      - 'supabase/functions/v14-bank-twelve-growth-admission/**'
  workflow_dispatch:
    inputs:
      admit:
        description: Execute signed factual admission only after reviewed verified deployment; false archives only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:edge -- supabase/functions/_shared/v14-bank-twelve-growth-review.test.ts supabase/functions/_shared/v14-reviewed-evidence.test.ts
      - run: npm run lint:edge
      - run: python -m py_compile scripts/v1-4/bank_twelve_growth_execute.py
  execute:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/banking-twelve-evidence'
    needs: verify
    runs-on: ubuntu-latest
    environment: PortfolioAI-Development
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3==1.35.99
      - name: Archive pinned originals and optionally execute signed source reviews
        env:
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BANK_TWELVE_GROWTH_ADMIT: ${{ inputs.admit }}
        run: python scripts/v1-4/bank_twelve_growth_execute.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bank-twelve-growth-execution
          path: bank-twelve-growth-execution/
          retention-days: 90
          if-no-files-found: warn

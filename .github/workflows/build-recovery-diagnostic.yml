name: PortfolioAI Build Recovery Diagnostic

on:
  push:
    branches:
      - portfolioai-build-recovery-scratch-20261005

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript diagnostic
        run: npm run typecheck
      - name: Production build diagnostic
        run: npm run build

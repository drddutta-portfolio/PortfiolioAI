name: PortfolioAI Build Recovery Diagnostic

on:
  push:
    branches:
      - portfolioai-build-recovery-scratch-20261005

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Architecture guard
        run: npm run check:architecture
      - name: TypeScript
        run: npm run typecheck
      - name: Targeted repair lint
        run: npx eslint src/features/backtesting/p8CorporateActionNormalization.ts src/types/node-crypto.d.ts
      - name: Affected regression tests
        run: npx vitest run src/features/backtesting/p8CorporateActionNormalization.test.ts src/features/backtesting/p8B4HistoricalEvidenceContract.test.ts
      - name: Production build
        run: npm run build
      - name: Diff and secret-pattern checks
        shell: bash
        run: |
          git diff --check f97cabbc155626b5f74ad8f5e065b9c984260680..HEAD
          if git diff --unified=0 f97cabbc155626b5f74ad8f5e065b9c984260680..HEAD             | grep '^+'             | grep -E -- '(-----BEGIN (RSA|EC|OPENSSH|PRIVATE)|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{20,}\.)'
          then
            echo "Potential secret material found in changed lines."
            exit 1
          fi

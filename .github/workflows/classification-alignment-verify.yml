name: Classification Alignment Verification

on:
  push:
    branches:
      - r2-dashboard-classification-alignment

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Targeted tests
        run: npx vitest run src/features/research/sectorResearchMapping.test.ts src/features/research/portfolioCoverageProjection.test.ts
      - name: Targeted typecheck
        run: npx tsc --ignoreConfig --noEmit --strict --skipLibCheck --jsx react-jsx --target ES2022 --module ESNext --moduleResolution Bundler src/features/research/sectorResearchMapping.ts src/features/research/sectorResearchMapping.test.ts src/features/research/portfolioCoverageProjection.ts src/features/research/portfolioCoverageProjection.test.ts src/features/portfolio/sharedClassification.ts src/features/portfolio/usePortfolioView.ts
      - name: Targeted lint
        run: npx eslint src/features/research/sectorResearchMapping.ts src/features/research/sectorResearchMapping.test.ts src/features/research/portfolioCoverageProjection.ts src/features/research/portfolioCoverageProjection.test.ts src/features/portfolio/sharedClassification.ts src/features/portfolio/usePortfolioView.ts
      - name: Repository typecheck diagnostic
        continue-on-error: true
        run: npm run typecheck
      - name: Repository lint diagnostic
        continue-on-error: true
        run: npm run lint
      - name: Repository build diagnostic
        continue-on-error: true
        run: npm run build

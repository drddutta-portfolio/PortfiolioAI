name: G02 Signed Canonical Read-Only Validation
on:
  workflow_dispatch:
    inputs:
      materialize:
        description: 'Persist source-qualified G02 evidence via one-time canonical grant'
        type: boolean
        default: false
  push:
    branches: [codex/g02-industry-evidence]
    paths:
      - .github/workflows/g02-canonical-validation.yml
      - scripts/v1-4/g02_canonical_validation.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    environment: PortfolioAI-Development
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/v1-4/g02_canonical_validation.py
        env:
          G02_MATERIALIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.materialize }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g02-canonical-read-only-validation
          path: g02-canonical-validation-result/
          retention-days: 90
          if-no-files-found: ignore

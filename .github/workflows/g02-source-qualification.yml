name: G02 Official Original Source Registration
on:
  workflow_dispatch:
  push:
    branches: [codex/g02-industry-evidence]
    paths:
      - .github/workflows/g02-source-qualification.yml
      - scripts/v1-4/g02_source_import.py
      - supabase/functions/_shared/v14-g02-original-pins.json
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    environment: PortfolioAI-Development
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/v1-4/test_g02_source_import.py
      - run: pip install boto3==1.35.99
      - name: Register only exact authorized originals
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: python scripts/v1-4/g02_source_import.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g02-official-original-source-registration
          path: g02-source-import-result/
          retention-days: 90
          if-no-files-found: ignore

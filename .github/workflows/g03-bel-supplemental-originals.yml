name: G03 BEL Supplemental Original Preservation
on:
  workflow_dispatch:
  push:
    branches: [codex/g02-industry-evidence]
    paths: [.github/workflows/g03-bel-supplemental-originals.yml]
permissions:
  contents: read
jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: PortfolioAI-Development
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3==1.35.99
      - name: Preserve four exact public BEL originals without evidence admission
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: python scripts/v1-4/g03_bel_archive_supplemental_originals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g03-bel-supplemental-originals
          path: g03-bel-supplemental-originals-result/
          retention-days: 90
          if-no-files-found: ignore

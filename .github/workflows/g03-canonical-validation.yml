name: G03 Signed Canonical Read-Only Validation
on:
  workflow_dispatch:
    inputs:
      materialize_remaining_documents:
        description: Save only the six remaining G03 stocks after their exact documentary reviews validate FRESH
        type: boolean
        default: false
      remaining_require_ready:
        description: Require every mandatory item FRESH before saving a remaining stock
        type: boolean
        default: false
      require_bel_ready:
        description: Require all BEL mandatory evidence FRESH and prospective READY before the BEL-only save
        type: boolean
        default: false
      require_bel_cash:
        description: Require the approved three-year BEL cash-component series before saving
        type: boolean
        default: false
      require_bel_orders:
        description: Require the qualified four-period BEL issuer order/revenue context before saving
        type: boolean
        default: false
      materialize_bel:
        description: Save only BEL after both fixed documentary reviews validate FRESH
        type: boolean
        default: false
      require_bel_roce:
        description: Require the admitted three-year BEL issuer ROCE series before saving
        type: boolean
        default: false
  push:
    branches: [codex/g02-industry-evidence]
    paths: [.github/workflows/g03-canonical-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: PortfolioAI-Development
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/v1-4/g03_canonical_validation.py
        env:
          G03_MATERIALIZE_REMAINING_DOCUMENTS: ${{ inputs.materialize_remaining_documents }}
          G03_REMAINING_REQUIRE_READY: ${{ inputs.remaining_require_ready }}
          G03_REQUIRE_BEL_READY: ${{ inputs.require_bel_ready }}
          G03_MATERIALIZE_BEL: ${{ inputs.materialize_bel }}
          G03_REQUIRE_BEL_ORDERS: ${{ inputs.require_bel_orders }}
          G03_REQUIRE_BEL_CASH: ${{ inputs.require_bel_cash }}
          G03_REQUIRE_BEL_ROCE: ${{ inputs.require_bel_roce }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g03-canonical-read-only-validation
          path: g03-canonical-validation-result/
          retention-days: 90
          if-no-files-found: ignore

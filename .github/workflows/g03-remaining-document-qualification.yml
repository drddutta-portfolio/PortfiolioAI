name: G03 Remaining Six Fixed Documentary Qualification
on:
  workflow_dispatch:
    inputs:
      admit_documents:
        description: Register qualified originals and admit only the fixed documentary findings
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: PortfolioAI-Development
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: pip install boto3==1.35.99
      - name: Verify exact originals and admit only fixed documentary findings
        env:
          G03_ADMIT_REMAINING_DOCUMENTS: ${{ inputs.admit_documents }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: python scripts/v1-4/g03_remaining_documents.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g03-remaining-six-documentary-result
          path: g03-remaining-document-result/
          retention-days: 90
          if-no-files-found: ignore

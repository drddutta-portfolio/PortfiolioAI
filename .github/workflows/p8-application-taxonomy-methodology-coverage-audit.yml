name: P8 Application Taxonomy Methodology Coverage Audit
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - scripts/p8/p8-application-taxonomy-methodology-coverage-audit.py
      - scripts/p8/test-p8-application-taxonomy-methodology-coverage-audit.py
      - .github/workflows/p8-application-taxonomy-methodology-coverage-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: PortfolioAI-Development}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --no-cache-dir "psycopg[binary]==3.2.10"
      - name: Build capability audit
        run: python scripts/p8/p8-application-taxonomy-methodology-coverage-audit.py
      - name: Validate capability audit
        run: python scripts/p8/test-p8-application-taxonomy-methodology-coverage-audit.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/p8/PortfolioAI_P8_APPLICATION_TAXONOMY_METHODOLOGY_COVERAGE_AUDIT_2026-10-04.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(p8): assess application taxonomy methodology coverage"
            git pull --rebase origin PortfolioAI-Development
            git push origin HEAD:PortfolioAI-Development
          fi

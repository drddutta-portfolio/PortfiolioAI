name: P8-B Recovery Exchange Metadata Canary

on:
  workflow_dispatch:
  push:
    branches:
      - PortfolioAI-Development
    paths:
      - scripts/p8/p8-b-recovery-exchange-metadata-canary.py
      - .github/workflows/p8-b-recovery-exchange-metadata-canary.yml

permissions:
  contents: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Development
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"
      - name: Run metadata-only canary
        id: canary
        shell: bash
        run: |
          set +e
          python scripts/p8/p8-b-recovery-exchange-metadata-canary.py > /tmp/p8-b-recovery-exchange-metadata-canary.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/p8-b-recovery-exchange-metadata-canary.json
          exit 0
      - name: Record canary audit
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/p8-b-recovery-exchange-metadata-canary.json docs/p8/PortfolioAI_P8_B_RECOVERY_EXCHANGE_METADATA_CANARY_AUDIT_2026-10-03.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/p8/PortfolioAI_P8_B_RECOVERY_EXCHANGE_METADATA_CANARY_AUDIT_2026-10-03.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(p8): record exchange metadata canary"
            git push
          fi
      - name: Enforce metadata transport
        if: steps.canary.outputs.exit_code != '0'
        run: |
          echo "Official exchange metadata canary did not fully pass; see committed audit." >&2
          exit 1

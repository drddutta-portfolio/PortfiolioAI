name: P8-B Recovery Workstream D
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - scripts/p8/p8-b-recovery-workstream-d.py
      - .github/workflows/p8-b-recovery-workstream-d.yml
permissions:
  contents: write
concurrency:
  group: p8-b-recovery-workstream-d
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: PortfolioAI-Development
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --no-cache-dir "boto3==1.40.46" "duckdb==1.4.1" "lxml==5.3.0"
      - id: execute
        shell: bash
        run: |
          set +e
          python scripts/p8/p8-b-recovery-workstream-d.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin PortfolioAI-Development
          git add docs/p8/PortfolioAI_P8_B_RECOVERY_WORKSTREAM_D_AUDIT_2026-10-04.json || true
          if ! git diff --cached --quiet; then
            git commit -m "audit(p8): record Workstream D materialization"
            git push origin HEAD:PortfolioAI-Development
          fi
      - if: steps.execute.outputs.code != '0'
        run: exit 1

name: P8 B3 N6R1 Blocker Census

on:
  workflow_dispatch:
  push:
    branches:
      - PortfolioAI-Development
    paths:
      - scripts/p8/p8-b3-n6r1-blocker-census.py
      - .github/workflows/p8-b3-n6r1-blocker-census.yml

permissions:
  contents: write

concurrency:
  group: p8-b3-n6r1-blocker-census-development
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Development bindings
        shell: bash
        run: |
          set -euo pipefail
          case "$SUPABASE_DB_URL" in
            *lrgpjimipfkyoqbpsqzz*) ;;
            *) echo "Refusing non-Development DB" >&2; exit 1 ;;
          esac
          test "$CLOUDFLARE_R2_BUCKET" = "portfolioai-history-dev"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "boto3==1.40.46" \
            "pyarrow==21.0.0" \
            "psycopg[binary]==3.2.10"

      - name: Build exact blocker census
        run: |
          mkdir -p tmp/p8-b3-n6r1
          python scripts/p8/p8-b3-n6r1-blocker-census.py > tmp/p8-b3-n6r1/summary.json

      - name: Verify and commit census
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.load(open("docs/p8/PortfolioAI_P8_B3_N6R1_BLOCKER_CENSUS_2026-10-03.json"))
          s=payload["summary"]
          checks={
            "status":s.get("status")=="PASS",
            "blocked_identities_439":s.get("blocked_identity_count")==439,
            "matrix_rows_439":s.get("matrix_row_count")==439,
            "blocker_events_562":s.get("blocker_event_count")==562,
            "n6_v1_not_overwritten":s.get("n6_v1_overwrite_permitted") is False,
            "n6r2_not_started":s.get("n6r2_started") is False,
            "prod_main_zero":s.get("production_changes")==0 and s.get("main_changes")==0,
          }
          if not all(checks.values()):
            raise SystemExit(json.dumps(checks,indent=2))
          Path("tmp/p8-b3-n6r1/checks.json").write_text(json.dumps(checks,indent=2)+"\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/p8/PortfolioAI_P8_B3_N6R1_BLOCKER_CENSUS_2026-10-03.json \
            docs/p8/PortfolioAI_P8_B3_N6R1_BLOCKER_IDENTITY_MATRIX_2026-10-03.csv
          git commit -m "audit(p8): record N6R1 blocker census"
          git push

      - name: Upload census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-b3-n6r1-blocker-census
          path: tmp/p8-b3-n6r1/*
          if-no-files-found: warn
          retention-days: 30

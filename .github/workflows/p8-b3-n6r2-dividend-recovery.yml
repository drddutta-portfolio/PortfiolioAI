name: P8 B3 N6R2 Dividend Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - PortfolioAI-Development
    paths:
      - scripts/p8/p8-b3-n6r2-dividend-recovery.py
      - .github/workflows/p8-b3-n6r2-dividend-recovery.yml

permissions:
  contents: write

concurrency:
  group: p8-b3-n6r2-dividend-recovery-development
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Development bindings
        shell: bash
        run: |
          set -euo pipefail
          case "$SUPABASE_DB_URL" in
            *lrgpjimipfkyoqbpsqzz*) ;;
            *) echo "Refusing non-Development DB" >&2; exit 1 ;;
          esac
          test "$CLOUDFLARE_R2_BUCKET" = "portfolioai-history-dev"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "boto3==1.40.46" \
            "duckdb==1.4.1" \
            "psycopg[binary]==3.2.10"

      - name: Run N6R2 dividend recovery
        run: |
          mkdir -p tmp/p8-b3-n6r2
          python scripts/p8/p8-b3-n6r2-dividend-recovery.py > tmp/p8-b3-n6r2/summary.json

      - name: Verify and commit recovery ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open("docs/p8/PortfolioAI_P8_B3_N6R2_DIVIDEND_RECOVERY_2026-10-03.json"))
          s=p["summary"]
          checks={
            "status":s.get("status")=="PASS",
            "nonempty":s.get("dividend_recovery_units",0)>0,
            "accounted":s.get("recovered_events",0)+s.get("still_blocked_events",0)==s.get("dividend_recovery_units",0),
            "n6_v1_unchanged":s.get("n6_v1_overwritten") is False,
            "n6r3_not_started":s.get("n6r3_started") is False,
            "prod_main_zero":s.get("production_changes")==0 and s.get("main_changes")==0,
          }
          if not all(checks.values()):
            raise SystemExit(json.dumps(checks,indent=2))
          Path("tmp/p8-b3-n6r2/checks.json").write_text(json.dumps(checks,indent=2)+"\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/p8/PortfolioAI_P8_B3_N6R2_DIVIDEND_RECOVERY_2026-10-03.json \
            docs/p8/PortfolioAI_P8_B3_N6R2_DIVIDEND_RECOVERY_MATRIX_2026-10-03.csv
          git commit -m "audit(p8): record N6R2 dividend recovery"
          git push

      - name: Upload N6R2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-b3-n6r2-dividend-recovery
          path: tmp/p8-b3-n6r2/*
          if-no-files-found: warn
          retention-days: 30

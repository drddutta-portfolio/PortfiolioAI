name: P8 B3 N6R5 V2 Materialization

on:
  workflow_dispatch:
  push:
    branches:
      - PortfolioAI-Development
    paths:
      - scripts/p8/p8-b3-n6r5-v2-materialization.py
      - .github/workflows/p8-b3-n6r5-v2-materialization.yml

permissions:
  contents: write

concurrency:
  group: p8-b3-n6r5-v2-materialization-development
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Development bindings
        shell: bash
        run: |
          set -euo pipefail
          case "$SUPABASE_DB_URL" in
            *lrgpjimipfkyoqbpsqzz*) ;;
            *) echo "Refusing non-Development DB" >&2; exit 1 ;;
          esac
          test "$CLOUDFLARE_R2_BUCKET" = "portfolioai-history-dev"
          git ls-remote origin refs/heads/main | awk '{print $1}' > /tmp/main-before.sha

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "boto3==1.40.46" \
            "pyarrow==21.0.0" \
            "psycopg[binary]==3.2.10"

      - name: Run N6R5 V2 materialization
        run: |
          mkdir -p tmp/p8-b3-n6r5
          python scripts/p8/p8-b3-n6r5-v2-materialization.py \
            > tmp/p8-b3-n6r5/summary.json

      - name: Verify N6R5 completion gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open("docs/p8/PortfolioAI_P8_B3_N6R5_V2_MATERIALIZATION_AUDIT_2026-10-03.json"))
          s=p["summary"]
          checks={
            "status":s.get("status")=="PASS",
            "policy":s.get("policy")=="STRICT_1_BENCHMARK_DAY",
            "v2_rows":s["v2_adjusted_series"]["row_count"]==1854978,
            "v2_daily_ready":s["v2_adjusted_series"]["ready_rows"]==1854978,
            "v2_daily_blocked":s["v2_adjusted_series"]["blocked_rows"]==0,
            "ledger_total":s["v2_decision_ledger"]["row_count"]==121956,
            "ledger_ready":s["v2_decision_ledger"]["ready_rows"]==82571,
            "ledger_blocked":s["v2_decision_ledger"]["blocked_rows"]==39385,
            "carry_forward":s["v2_decision_ledger"]["carry_forward_recoveries"]==1177,
            "complex":s["v2_decision_ledger"]["blocker_counts"].get("COMPLEX_CORPORATE_ACTION_BLOCKER")==9,
            "no_trade":s["v2_decision_ledger"]["blocker_counts"].get("NO_TRADE_ON_DECISION_DATE")==39376,
            "v1_unchanged":s["frozen_v1"]["overwritten"] is False,
            "no_boundary_cross":s["policy_gates"]["corporate_action_boundary_crossing"] is False,
            "no_silent_imputation":s["policy_gates"]["silent_imputation"] is False,
            "n6r6_not_started":s["policy_gates"]["n6r6_started"] is False,
            "prod_main_zero":s.get("production_changes")==0 and s.get("main_changes")==0,
          }
          if not all(checks.values()):
              raise SystemExit(json.dumps(checks,indent=2))
          Path("tmp/p8-b3-n6r5/checks.json").write_text(json.dumps(checks,indent=2)+"\n")
          PY
          git ls-remote origin refs/heads/main | awk '{print $1}' > /tmp/main-after.sha
          cmp /tmp/main-before.sha /tmp/main-after.sha

      - name: Commit N6R5 audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/p8/PortfolioAI_P8_B3_N6R5_V2_MATERIALIZATION_AUDIT_2026-10-03.json
          git commit -m "audit(p8): record N6R5 V2 materialization"
          git push

      - name: Upload N6R5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-b3-n6r5-v2-materialization
          path: tmp/p8-b3-n6r5/*
          if-no-files-found: warn
          retention-days: 30

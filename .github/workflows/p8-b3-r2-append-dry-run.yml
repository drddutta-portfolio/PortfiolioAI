name: P8 B3 R2 Append Dry Run

on:
  workflow_dispatch:
  push:
    branches:
      - PortfolioAI-Development
    paths:
      - scripts/p8/p8-b3-r2-append-dry-run.py
      - .github/workflows/p8-b3-r2-append-dry-run.yml

permissions:
  contents: read

concurrency:
  group: p8-b3-r2-append-dry-run-development
  cancel-in-progress: true

jobs:
  validate:
    name: validate-known-date-and-plan-day-241
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}

    steps:
      - name: Checkout Development
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Development bindings
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_R2_BUCKET
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done
          case "$SUPABASE_DB_URL" in
            *lrgpjimipfkyoqbpsqzz*) ;;
            *) echo "Refusing non-Development database URL" >&2; exit 1 ;;
          esac
          test "$CLOUDFLARE_R2_BUCKET" = "portfolioai-history-dev"

      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "boto3==1.40.46" \
            "duckdb==1.4.1" \
            "psycopg[binary]==3.2.10"

      - name: Validate known partition and plan day 241
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/p8-b3-r2-append-dry-run
          python scripts/p8/p8-b3-r2-append-dry-run.py \
            | tee tmp/p8-b3-r2-append-dry-run/result.json

      - name: Publish dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8-b3-r2-append-dry-run
          path: tmp/p8-b3-r2-append-dry-run/result.json
          if-no-files-found: error
          retention-days: 30

name: P8 B3 Finalize Day 241 R2

on:
  workflow_dispatch:
  push:
    branches:
      - PortfolioAI-Development
    paths:
      - scripts/p8/p8-b3-r2-finalize-day241.py
      - .github/workflows/p8-b3-r2-finalize-day241.yml

permissions:
  contents: write

concurrency:
  group: p8-b3-r2-finalize-day241-development
  cancel-in-progress: true

jobs:
  finalize:
    name: finalize-2024-09-19
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}

    steps:
      - name: Checkout Development
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Development bindings
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_R2_BUCKET
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done
          case "$SUPABASE_DB_URL" in
            *lrgpjimipfkyoqbpsqzz*) ;;
            *) echo "Refusing non-Development database URL" >&2; exit 1 ;;
          esac
          test "$CLOUDFLARE_R2_BUCKET" = "portfolioai-history-dev"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "boto3==1.40.46" \
            "duckdb==1.4.1" \
            "psycopg[binary]==3.2.10"

      - name: Finalize day 241
        id: finalize
        shell: bash
        run: |
          set +e
          mkdir -p tmp/p8-b3-r2-day241-finalize
          python scripts/p8/p8-b3-r2-finalize-day241.py \
            > tmp/p8-b3-r2-day241-finalize/stdout.log \
            2> tmp/p8-b3-r2-day241-finalize/stderr.log
          status=$?
          echo "$status" > tmp/p8-b3-r2-day241-finalize/exit_code.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record finalizer audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("tmp/p8-b3-r2-day241-finalize")
          code=int((root/"exit_code.txt").read_text().strip())
          stdout=(root/"stdout.log").read_text(errors="replace")
          stderr=(root/"stderr.log").read_text(errors="replace")
          result=None
          if code==0:
              try:
                  result=json.loads(stdout)
              except Exception:
                  result=None
          payload={
            "version":"P8_B3_DAY241_FINALIZER_CI_AUDIT_V1",
            "status":"PASS" if code==0 and isinstance(result,dict) and result.get("status")=="PASS" else "FAIL",
            "exit_code":code,
            "result":result,
            "stdout":stdout[-20000:],
            "stderr":stderr[-20000:],
          }
          Path("docs/p8/PortfolioAI_P8_B3_R2_DAY241_FINALIZER_LATEST.json").write_text(
            json.dumps(payload,indent=2,sort_keys=True)+"\n"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/p8/PortfolioAI_P8_B3_R2_DAY241_FINALIZER_LATEST.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(p8): record day-241 R2 finalizer"
            git push
          fi

      - name: Enforce finalizer result
        if: steps.finalize.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Day-241 finalizer failed; see Development audit file." >&2
          exit 1

      - name: Publish finalizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-b3-r2-day241-finalizer
          path: tmp/p8-b3-r2-day241-finalize/*
          if-no-files-found: warn
          retention-days: 30

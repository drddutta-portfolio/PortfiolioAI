name: P8 B3 Source Completion Audit
# rerun-marker-b2-authority-fix

on:
  workflow_dispatch:
  push:
    branches:
      - PortfolioAI-Development
    paths:
      - scripts/p8/p8-b3-source-completion-audit.py
      - .github/workflows/p8-b3-source-completion-audit.yml

permissions:
  contents: write

concurrency:
  group: p8-b3-source-completion-audit-development
  cancel-in-progress: false

jobs:
  audit:
    name: verify-b3-source-completion
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}

    steps:
      - name: Checkout Development
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Development bindings
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_R2_BUCKET
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done
          case "$SUPABASE_DB_URL" in
            *lrgpjimipfkyoqbpsqzz*) ;;
            *) echo "Refusing non-Development database URL" >&2; exit 1 ;;
          esac
          test "$CLOUDFLARE_R2_BUCKET" = "portfolioai-history-dev"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "boto3==1.40.46" \
            "duckdb==1.4.1" \
            "psycopg[binary]==3.2.10"

      - name: Run formal source completion audit
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p tmp/p8-b3-source-completion-audit
          python scripts/p8/p8-b3-source-completion-audit.py \
            > tmp/p8-b3-source-completion-audit/stdout.json \
            2> tmp/p8-b3-source-completion-audit/stderr.log
          status=$?
          echo "$status" > tmp/p8-b3-source-completion-audit/exit_code.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record formal audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("tmp/p8-b3-source-completion-audit")
          code=int((root/"exit_code.txt").read_text().strip())
          stdout=(root/"stdout.json").read_text(errors="replace")
          stderr=(root/"stderr.log").read_text(errors="replace")
          result=None
          if code==0:
              try:
                  result=json.loads(stdout)
              except Exception:
                  result=None
          payload={
            "version":"P8_B3_SOURCE_COMPLETION_CI_AUDIT_V1",
            "status":"PASS" if code==0 and isinstance(result,dict) and result.get("status")=="PASS" else "FAIL",
            "exit_code":code,
            "result":result,
            "stderr":stderr[-30000:],
          }
          Path("docs/p8/PortfolioAI_P8_B3_SOURCE_COMPLETION_VERIFICATION_2026-10-03.json").write_text(
            json.dumps(payload,indent=2,sort_keys=True)+"\n"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/p8/PortfolioAI_P8_B3_SOURCE_COMPLETION_VERIFICATION_2026-10-03.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(p8): record B3 source completion verification"
            git push
          fi

      - name: Enforce audit result
        if: steps.audit.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "P8-B3 source completion audit failed; see recorded audit." >&2
          exit 1

      - name: Enforce semantic PASS
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open("docs/p8/PortfolioAI_P8_B3_SOURCE_COMPLETION_VERIFICATION_2026-10-03.json"))
          if p.get("status")!="PASS":
              raise SystemExit("Formal B3 source completion audit did not PASS")
          PY

      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-b3-source-completion-audit
          path: tmp/p8-b3-source-completion-audit/*
          if-no-files-found: warn
          retention-days: 30

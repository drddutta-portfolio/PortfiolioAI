name: P8 B3 S3 Parquet Canary

on:
  push:
    branches:
      - p8-b3-storage-s3-canary
    paths:
      - "scripts/p8/p8-b3-storage-s3-parquet-canary.py"
      - "scripts/p8/fixtures/p8-b3-storage-s3-canary-2023-10-03.json"
      - ".github/workflows/p8-b3-storage-s3-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parquet-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canary branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned DuckDB
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir duckdb==1.5.6

      - name: Run exact Parquet round-trip canary
        run: |
          python scripts/p8/p8-b3-storage-s3-parquet-canary.py \
            --fixture scripts/p8/fixtures/p8-b3-storage-s3-canary-2023-10-03.json \
            --out-dir tmp/p8-b3-storage-s3-canary

      - name: Verify Cloudflare R2 upload and read-back when configured
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail

          if [[ -z "${R2_ACCOUNT_ID}" || -z "${R2_ACCESS_KEY_ID}" || -z "${R2_SECRET_ACCESS_KEY}" || -z "${R2_BUCKET}" ]]; then
            echo "R2_CANARY=SKIPPED_MISSING_SECRETS"
            exit 0
          fi

          if ! command -v aws >/dev/null 2>&1; then
            echo "AWS CLI is required for the R2 verification step."
            exit 1
          fi

          PARQUET="tmp/p8-b3-storage-s3-canary/p8-b3-storage-s3-canary-2023-10-03.parquet"
          READBACK="tmp/p8-b3-storage-s3-canary/r2-readback.parquet"
          OBJECT_KEY="portfolioai-history/development/p8/b3/canary/v1/trade_date=2023-10-03/p8-b3-storage-s3-canary.parquet"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          LOCAL_SHA="$(sha256sum "${PARQUET}" | awk '{print $1}')"

          aws s3 cp "${PARQUET}" "s3://${R2_BUCKET}/${OBJECT_KEY}" \
            --endpoint-url "${ENDPOINT}" \
            --only-show-errors

          aws s3 cp "s3://${R2_BUCKET}/${OBJECT_KEY}" "${READBACK}" \
            --endpoint-url "${ENDPOINT}" \
            --only-show-errors

          REMOTE_SHA="$(sha256sum "${READBACK}" | awk '{print $1}')"

          if [[ "${LOCAL_SHA}" != "${REMOTE_SHA}" ]]; then
            echo "P8_B3_S3_R2_SHA256_MISMATCH"
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("tmp/p8-b3-storage-s3-canary/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["remote_storage"] = {
              "provider": "CLOUDFLARE_R2",
              "bucket": os.environ["R2_BUCKET"],
              "object_key": (
                  "portfolioai-history/development/p8/b3/canary/v1/"
                  "trade_date=2023-10-03/p8-b3-storage-s3-canary.parquet"
              ),
              "upload_verified": True,
              "download_sha256_verified": True,
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("R2_CANARY=PASS")
          PY

      - name: Publish S3 canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8-b3-storage-s3-canary
          path: tmp/p8-b3-storage-s3-canary/
          if-no-files-found: error
          retention-days: 14


  full-r2-backup:
    needs: parquet-canary
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Back up four large Development tables to R2
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://portfolioai-r2-full-backup.dr-d-dutta.workers.dev"
          DATASETS=(
            "b3_raw_prices"
            "b2_listing_observations"
            "b2_listing_evidence"
            "b2_universe_members"
          )

          mkdir -p backup-evidence
          : > backup-evidence/chunks.ndjson

          for DATASET in "${DATASETS[@]}"; do
            echo "=== START ${DATASET} ==="
            PAGE=0

            while true; do
              if (( PAGE > 2000 )); then
                echo "Page guard exceeded for ${DATASET}"
                exit 1
              fi

              URL="${BASE}/?dataset=${DATASET}&page=${PAGE}"
              RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 120 "${URL}")"
              echo "${RESPONSE}" | tee -a backup-evidence/chunks.ndjson

              RESULT="$(RESPONSE="${RESPONSE}" python - <<'PY'
import json, os
r = json.loads(os.environ["RESPONSE"])
if r.get("ok") is not True:
    raise SystemExit(f"Backup chunk failed: {r}")
if r.get("source_sha256") != r.get("readback_sha256"):
    raise SystemExit(f"Hash mismatch: {r}")
rows = r.get("rows")
done = bool(r.get("done"))
print(f"{rows if rows is not None else ''}|{1 if done else 0}")
PY
)"
              ROWS="${RESULT%%|*}"
              DONE="${RESULT##*|}"

              echo "dataset=${DATASET} page=${PAGE} rows=${ROWS:-unknown} done=${DONE}"

              if [[ "${DONE}" == "1" ]]; then
                break
              fi

              PAGE=$((PAGE + 1))
            done

            echo "=== COMPLETE ${DATASET} pages=$((PAGE + 1)) ==="
          done

          python - <<'PY'
import json, pathlib, hashlib
p = pathlib.Path("backup-evidence/chunks.ndjson")
rows = [json.loads(line) for line in p.read_text().splitlines() if line.strip()]
summary = {}
for r in rows:
    d = r["dataset"]
    s = summary.setdefault(d, {"chunks":0,"rows":0,"bytes":0,"all_verified":True})
    s["chunks"] += 1
    if r.get("rows") is not None:
        s["rows"] += int(r["rows"])
    s["bytes"] += int(r["bytes"])
    s["all_verified"] = s["all_verified"] and r.get("source_sha256") == r.get("readback_sha256")
manifest = {
    "status":"PASS" if all(v["all_verified"] for v in summary.values()) else "FAIL",
    "datasets":summary,
    "chunk_log_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
}
pathlib.Path("backup-evidence/summary.json").write_text(json.dumps(manifest, indent=2, sort_keys=True)+"\n")
print(json.dumps(manifest, indent=2, sort_keys=True))
if manifest["status"] != "PASS":
    raise SystemExit(1)
PY

      - name: Publish full-backup evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8-full-r2-backup-evidence
          path: backup-evidence/
          if-no-files-found: error
          retention-days: 30

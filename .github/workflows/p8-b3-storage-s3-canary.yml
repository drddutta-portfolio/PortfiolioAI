name: P8 B3 S3 Parquet Canary
# Full backup paging contract: 1000 rows per verified R2 chunk

on:
  push:
    branches:
      - p8-b3-storage-s3-canary
    paths:
      - "scripts/p8/p8-b3-storage-s3-parquet-canary.py"
      - "scripts/p8/fixtures/p8-b3-storage-s3-canary-2023-10-03.json"
      - ".github/workflows/p8-b3-storage-s3-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parquet-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canary branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned DuckDB
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir duckdb==1.5.6

      - name: Run exact Parquet round-trip canary
        run: |
          python scripts/p8/p8-b3-storage-s3-parquet-canary.py \
            --fixture scripts/p8/fixtures/p8-b3-storage-s3-canary-2023-10-03.json \
            --out-dir tmp/p8-b3-storage-s3-canary

      - name: Publish S3 canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8-b3-storage-s3-canary
          path: tmp/p8-b3-storage-s3-canary/
          if-no-files-found: error
          retention-days: 14

  full-r2-backup:
    needs: parquet-canary
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Back up four large Development tables to R2
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://portfolioai-r2-full-backup.dr-d-dutta.workers.dev"
          DATASETS=(
            "b3_raw_prices"
            "b2_listing_observations"
            "b2_listing_evidence"
            "b2_universe_members"
          )

          mkdir -p backup-evidence
          : > backup-evidence/chunks.ndjson

          for DATASET in "${DATASETS[@]}"; do
            echo "=== START ${DATASET} ==="
            PAGE=0

            while true; do
              if (( PAGE > 2000 )); then
                echo "Page guard exceeded for ${DATASET}"
                exit 1
              fi

              URL="${BASE}/?dataset=${DATASET}&page=${PAGE}"
              RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 120 "${URL}")"
              echo "${RESPONSE}" | tee -a backup-evidence/chunks.ndjson

              echo "${RESPONSE}" | jq -e '.ok == true and .source_sha256 == .readback_sha256' >/dev/null
              ROWS="$(echo "${RESPONSE}" | jq -r '.rows // empty')"
              DONE="$(echo "${RESPONSE}" | jq -r 'if .done then "1" else "0" end')"

              echo "dataset=${DATASET} page=${PAGE} rows=${ROWS:-unknown} done=${DONE}"

              if [[ "${DONE}" == "1" ]]; then
                break
              fi

              PAGE=$((PAGE + 1))
            done

            echo "=== COMPLETE ${DATASET} pages=$((PAGE + 1)) ==="
          done

      - name: Build backup evidence summary
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          p = Path("backup-evidence/chunks.ndjson")
          entries = [json.loads(line) for line in p.read_text().splitlines() if line.strip()]
          summary = {}
          for r in entries:
              d = r["dataset"]
              s = summary.setdefault(d, {"chunks": 0, "rows": 0, "bytes": 0, "all_verified": True})
              s["chunks"] += 1
              if r.get("rows") is not None:
                  s["rows"] += int(r["rows"])
              s["bytes"] += int(r["bytes"])
              s["all_verified"] = s["all_verified"] and r.get("source_sha256") == r.get("readback_sha256")

          required = {
              "b3_raw_prices",
              "b2_listing_observations",
              "b2_listing_evidence",
              "b2_universe_members",
          }
          status = "PASS" if set(summary) == required and all(v["all_verified"] for v in summary.values()) else "FAIL"
          manifest = {
              "status": status,
              "datasets": summary,
              "chunk_log_sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
          }
          Path("backup-evidence/summary.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          if status != "PASS":
              raise SystemExit(1)
          PY

      - name: Publish full-backup evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8-full-r2-backup-evidence
          path: backup-evidence/
          if-no-files-found: error
          retention-days: 30

name: P8 Build Official Four-Tier Taxonomy Reference
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - scripts/p8/p8-build-official-four-tier-taxonomy.py
      - scripts/p8/test-p8-build-official-four-tier-taxonomy.py
      - .github/workflows/p8-build-official-four-tier-taxonomy.yml
permissions:
  contents: write
concurrency:
  group: p8-build-official-four-tier-taxonomy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: PortfolioAI-Development}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --no-cache-dir "requests==2.32.5" "pdfplumber==0.11.7"
      - name: Parser tests
        run: python scripts/p8/test-p8-build-official-four-tier-taxonomy.py
      - name: Inspect PDF coordinates for parser calibration
        run: |
          python - <<'PY'
          import requests, pdfplumber, io
          u="https://nsearchives.nseindia.com/s3fs-public/inline-files/nse-indices_industry-classification-structure-2022-11.pdf"
          b=requests.get(u,timeout=60,headers={"User-Agent":"Mozilla/5.0 PortfolioAI taxonomy-reference audit"}).content
          with pdfplumber.open(io.BytesIO(b)) as pdf:
              for pidx in (13,14):
                  p=pdf.pages[pidx]
                  words=p.extract_words(x_tolerance=2,y_tolerance=2)
                  lines={}
                  for w in words: lines.setdefault(round(float(w["top"]),1),[]).append(w)
                  print("PAGE",pidx+1)
                  for top,ws in sorted(lines.items()):
                      ws=sorted(ws,key=lambda z:float(z["x0"]))
                      txt=" ".join(x["text"] for x in ws)
                      if "IN06" in txt or "IN07" in txt or "MES_Code" in txt or "Basic_Ind_Code" in txt:
                          print(top,[(round(float(x["x0"]),1),x["text"]) for x in ws])
          PY
      - name: Fetch and build official taxonomy reference
        run: python scripts/p8/p8-build-official-four-tier-taxonomy.py
      - name: Commit reference package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin PortfolioAI-Development
          git add docs/p8/PortfolioAI_P8_NSE_FOUR_TIER_TAXONOMY_NOVEMBER_2022.json docs/p8/PortfolioAI_P8_NSE_FOUR_TIER_TAXONOMY_NOVEMBER_2022_ADOPTION_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(p8): build official NSE four-tier taxonomy reference"
            git push origin HEAD:PortfolioAI-Development
          fi

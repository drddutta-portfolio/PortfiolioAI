name: P8 Complete Four-Tier Taxonomy Canary Revalidation
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - scripts/p8/p8-revalidate-complete-four-tier-canary.py
      - scripts/p8/test-p8-revalidate-complete-four-tier-canary.py
      - .github/workflows/p8-complete-four-tier-canary-revalidation.yml
permissions:
  contents: write
concurrency:
  group: p8-complete-four-tier-canary-revalidation
  cancel-in-progress: false
jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: PortfolioAI-Development}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --no-cache-dir "boto3==1.40.46"
      - name: Canary mapping tests
        run: python scripts/p8/test-p8-revalidate-complete-four-tier-canary.py
      - name: Revalidate exact frozen canary
        run: python scripts/p8/p8-revalidate-complete-four-tier-canary.py
      - name: Commit revalidation audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/p8/PortfolioAI_P8_COMPLETE_FOUR_TIER_TAXONOMY_CANARY_REVALIDATION_2026-10-04.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(p8): revalidate frozen canary on complete taxonomy"
            git pull --rebase origin PortfolioAI-Development
            git push origin HEAD:PortfolioAI-Development
          fi

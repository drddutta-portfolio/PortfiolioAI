name: P8 Full R2 Backup

on:
  push:
    branches:
      - p8-b3-storage-s3-canary
    paths:
      - ".github/workflows/p8-full-r2-backup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Back up four large Development tables to R2
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://portfolioai-r2-full-backup.dr-d-dutta.workers.dev"
          DATASETS=(
            "b3_raw_prices"
            "b2_listing_observations"
            "b2_listing_evidence"
            "b2_universe_members"
          )

          mkdir -p backup-evidence
          : > backup-evidence/chunks.ndjson

          for DATASET in "${DATASETS[@]}"; do
            echo "=== START ${DATASET} ==="
            PAGE=0

            while true; do
              if (( PAGE > 2000 )); then
                echo "Page guard exceeded for ${DATASET}"
                exit 1
              fi

              URL="${BASE}/?dataset=${DATASET}&page=${PAGE}"
              RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 120 "${URL}")"
              echo "${RESPONSE}" | tee -a backup-evidence/chunks.ndjson

              RESULT="$(RESPONSE="${RESPONSE}" python - <<'PY'
import json, os
r = json.loads(os.environ["RESPONSE"])
if r.get("ok") is not True:
    raise SystemExit(f"Backup chunk failed: {r}")
if r.get("source_sha256") != r.get("readback_sha256"):
    raise SystemExit(f"Hash mismatch: {r}")
rows = r.get("rows")
done = bool(r.get("done"))
print(f"{rows if rows is not None else ''}|{1 if done else 0}")
PY
)"
              ROWS="${RESULT%%|*}"
              DONE="${RESULT##*|}"

              echo "dataset=${DATASET} page=${PAGE} rows=${ROWS:-unknown} done=${DONE}"

              if [[ "${DONE}" == "1" ]]; then
                break
              fi

              PAGE=$((PAGE + 1))
            done

            echo "=== COMPLETE ${DATASET} pages=$((PAGE + 1)) ==="
          done

          python - <<'PY'
import json, pathlib, hashlib
p = pathlib.Path("backup-evidence/chunks.ndjson")
rows = [json.loads(line) for line in p.read_text().splitlines() if line.strip()]
summary = {}
for r in rows:
    d = r["dataset"]
    s = summary.setdefault(d, {"chunks":0,"rows":0,"bytes":0,"all_verified":True})
    s["chunks"] += 1
    if r.get("rows") is not None:
        s["rows"] += int(r["rows"])
    s["bytes"] += int(r["bytes"])
    s["all_verified"] = s["all_verified"] and r.get("source_sha256") == r.get("readback_sha256")
manifest = {
    "status":"PASS" if all(v["all_verified"] for v in summary.values()) else "FAIL",
    "datasets":summary,
    "chunk_log_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
}
pathlib.Path("backup-evidence/summary.json").write_text(json.dumps(manifest, indent=2, sort_keys=True)+"\n")
print(json.dumps(manifest, indent=2, sort_keys=True))
if manifest["status"] != "PASS":
    raise SystemExit(1)
PY

      - name: Publish full-backup evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8-full-r2-backup-evidence
          path: backup-evidence/
          if-no-files-found: error
          retention-days: 30

name: P8 Historical Taxonomy Canary Freeze
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - scripts/p8/p8-historical-taxonomy-canary-freeze.py
      - .github/workflows/p8-historical-taxonomy-canary-freeze.yml
permissions:
  contents: write
concurrency:
  group: p8-historical-taxonomy-canary-freeze
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: PortfolioAI-Development}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --no-cache-dir "boto3==1.40.46" "psycopg[binary]==3.2.10"
      - run: python scripts/p8/p8-historical-taxonomy-canary-freeze.py
      - name: Commit frozen canary manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin PortfolioAI-Development
          git add docs/p8/PortfolioAI_P8_HISTORICAL_TAXONOMY_CANARY_MANIFEST_2026-10-04.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(p8): freeze historical taxonomy canary"
            git push origin HEAD:PortfolioAI-Development
          fi

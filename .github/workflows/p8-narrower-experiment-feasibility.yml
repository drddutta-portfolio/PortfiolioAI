name: P8 Narrower Experiment Feasibility Audit
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - scripts/p8/p8-narrower-experiment-feasibility.py
      - .github/workflows/p8-narrower-experiment-feasibility.yml
permissions:
  contents: write
concurrency:
  group: p8-narrower-experiment-feasibility
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: PortfolioAI-Development
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --no-cache-dir "boto3==1.40.46" "pyarrow==17.0.0"
      - run: python scripts/p8/p8-narrower-experiment-feasibility.py
      - name: Commit authorized feasibility artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin PortfolioAI-Development
          git add docs/p8/PortfolioAI_P8_NARROWER_EXPERIMENT_DECISION_MEMO.md docs/p8/PortfolioAI_P8_NARROWER_EXPERIMENT_FEASIBILITY_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(p8): record narrower experiment feasibility"
            git push origin HEAD:PortfolioAI-Development
          fi

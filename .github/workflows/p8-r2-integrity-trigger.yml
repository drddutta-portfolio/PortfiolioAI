name: Trigger R2 Integrity Worker

on:
  push:
    branches:
      - p8-b3-storage-s3-canary
    paths:
      - ".github/workflows/p8-r2-integrity-trigger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canary branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned DuckDB
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir duckdb==1.5.6

      - name: Regenerate exact canary
        run: |
          python scripts/p8/p8-b3-storage-s3-parquet-canary.py \
            --fixture scripts/p8/fixtures/p8-b3-storage-s3-canary-2023-10-03.json \
            --out-dir tmp/p8-b3-storage-s3-canary

      - name: Upload exact bytes through integrity worker and verify R2 read-back
        run: |
          set -euo pipefail
          FILE="tmp/p8-b3-storage-s3-canary/p8-b3-storage-s3-canary-2023-10-03.parquet"
          LOCAL_SHA="$(sha256sum "$FILE" | awk '{print $1}')"
          LOCAL_SIZE="$(wc -c < "$FILE" | tr -d ' ')"

          test "$LOCAL_SHA" = "fb5f9b07d510cdaf7336f8a84b76c97740ff79566b81d6361d0c2468b873450f"
          test "$LOCAL_SIZE" = "6330"

          RESPONSE="$(curl --fail --silent --show-error --retry 3 \
            --request POST \
            --header 'Content-Type: application/octet-stream' \
            --data-binary @"$FILE" \
            https://portfolioai-r2-integrity-canary.dr-d-dutta.workers.dev)"

          echo "$RESPONSE"

          RESPONSE="$RESPONSE" python - <<'PY'
          import json, os
          r=json.loads(os.environ["RESPONSE"])
          expected="fb5f9b07d510cdaf7336f8a84b76c97740ff79566b81d6361d0c2468b873450f"
          assert r["ok"] is True, r
          assert r["size"] == 6330, r
          assert r["source_sha256"] == expected, r
          assert r["readback_sha256"] == expected, r
          print("R2_BYTE_LEVEL_VERIFICATION=PASS")
          PY

name: P8 Segment Revenue Frozen Canary Audit
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - scripts/p8/p8-segment-revenue-canary-accounting.py
      - scripts/p8/test-p8-segment-revenue-canary-accounting.py
      - scripts/p8/p8-apply-segment-canary-router.ts
      - .github/workflows/p8-segment-revenue-canary-audit.yml
permissions:
  contents: write
concurrency:
  group: p8-segment-revenue-canary-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: PortfolioAI-Development}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python -m pip install --no-cache-dir "boto3==1.40.46" "lxml==6.0.2" "psycopg[binary]==3.2.10"
      - name: Accounting contract tests
        run: python scripts/p8/test-p8-segment-revenue-canary-accounting.py
      - name: Read-only source and accounting audit
        run: python scripts/p8/p8-segment-revenue-canary-accounting.py
      - name: Apply actual canonical router to candidate classifications
        run: npx --yes tsx@4.20.6 scripts/p8/p8-apply-segment-canary-router.ts
      - name: Commit canary audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/p8/PortfolioAI_P8_SEGMENT_REVENUE_CANARY_SOURCE_ACCOUNTING_AUDIT_2026-10-04.json docs/p8/PortfolioAI_P8_SEGMENT_REVENUE_CANARY_CLASSIFICATION_AUDIT_2026-10-04.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(p8): evaluate frozen canary segment revenue contract"
            git pull --rebase origin PortfolioAI-Development
            git push origin HEAD:PortfolioAI-Development
          fi

name: P8 Segment Revenue Methodology Source Assessment
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - scripts/p8/p8-segment-revenue-methodology-source-assessment.py
      - .github/workflows/p8-segment-revenue-methodology-source-assessment.yml
permissions:
  contents: write
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: PortfolioAI-Development}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --no-cache-dir "requests==2.32.5" "beautifulsoup4==4.13.4" "pdfplumber==0.11.7"
      - run: python scripts/p8/p8-segment-revenue-methodology-source-assessment.py
      - name: Commit assessment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/p8/PortfolioAI_P8_SEGMENT_REVENUE_METHODOLOGY_SOURCE_ASSESSMENT_2026-10-04.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(p8): record segment revenue methodology source assessment"
            git pull --rebase origin PortfolioAI-Development
            git push origin HEAD:PortfolioAI-Development
          fi

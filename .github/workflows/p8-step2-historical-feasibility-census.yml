name: P8 Step 2 full historical feasibility census
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - 'scripts/p8/p8-step2-*'
      - 'scripts/p8/test-p8-step2-*'
      - 'docs/p8/PortfolioAI_P8_STEP2_HISTORICAL_FEASIBILITY_CONTRACT_V1.json'
      - '.github/workflows/p8-step2-historical-feasibility-census.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p8-step2-historical-feasibility-census
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: PortfolioAI-Development}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: python -m pip install --no-cache-dir "boto3==1.40.46" "lxml==5.3.0" "pyarrow==21.0.0" "psycopg[binary]==3.2.10"
      - run: python scripts/p8/test-p8-step2-historical-feasibility-census.py
      - run: node --experimental-strip-types scripts/p8/test-p8-step1-actual-router-canary.mjs
      - id: execute
        shell: bash
        run: |
          set +e
          python scripts/p8/p8-step2-historical-feasibility-census.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit completed Step 2 census artifacts
        if: steps.execute.outputs.code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin PortfolioAI-Development
          git add docs/p8/PortfolioAI_P8_STEP2_FULL_HISTORICAL_FEASIBILITY_AUDIT_2026-10-05.json \
                  docs/p8/PortfolioAI_P8_STEP2_PAIR_DISPOSITIONS_2026-10-05.jsonl.gz \
                  docs/p8/PortfolioAI_P8_STEP2_NARROWER_EXPERIMENT_PROPOSAL_2026-10-05.json \
                  docs/p8/PortfolioAI_P8_STEP2_DECISION_MEMO_2026-10-05.md
          git commit -m "audit(p8): complete Step 2 historical feasibility census"
          git push origin HEAD:PortfolioAI-Development
      - if: steps.execute.outputs.code != '0'
        run: exit 1

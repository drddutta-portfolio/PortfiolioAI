name: P8 Direct PostgreSQL Backup to R2

on:
  push:
    branches: [p8-storage-full-backup]
    paths:
      - ".github/workflows/p8-storage-pgdump-backup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pgdump-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - name: Require backup secrets
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          test -n "${CLOUDFLARE_R2_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_R2_ACCESS_KEY_ID}"
          test -n "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}"
          test -n "${CLOUDFLARE_R2_BUCKET}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install R2 client
        run: python -m pip install --disable-pip-version-check --no-cache-dir boto3==1.40.46

      - name: Normalize and preflight R2
        run: |
          python - <<'PY'
          import hashlib, os, re
          from urllib.parse import urlparse
          import boto3
          from botocore.config import Config

          raw=os.environ["CLOUDFLARE_R2_ACCOUNT_ID"].strip().rstrip("/")
          if "://" in raw:
              host=urlparse(raw).hostname or ""
          else:
              host=raw
          suffix=".r2.cloudflarestorage.com"
          account=host[:-len(suffix)] if host.endswith(suffix) else host
          if not re.fullmatch(r"[0-9a-fA-F]{32}", account):
              raise SystemExit("CLOUDFLARE_R2_ACCOUNT_ID must be a 32-character Account ID or its standard R2 endpoint URL")

          endpoint=f"https://{account}.r2.cloudflarestorage.com"
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write(f"R2_ENDPOINT={endpoint}\n")

          client=boto3.client(
              "s3",
              endpoint_url=endpoint,
              aws_access_key_id=os.environ["CLOUDFLARE_R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["CLOUDFLARE_R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(
                  retries={"max_attempts":8,"mode":"adaptive"},
                  connect_timeout=30,
                  read_timeout=120,
                  s3={"addressing_style":"path"},
              ),
          )
          bucket=os.environ["CLOUDFLARE_R2_BUCKET"]
          key=f"portfolioai-history/development/p8/_preflight/{os.environ['GITHUB_RUN_ID']}.txt"
          body=b"portfolioai-r2-preflight-v1\n"
          client.put_object(Bucket=bucket,Key=key,Body=body,ContentType="text/plain")
          got=client.get_object(Bucket=bucket,Key=key)["Body"].read()
          if hashlib.sha256(got).digest()!=hashlib.sha256(body).digest():
              raise SystemExit("R2 preflight read-back hash mismatch")
          client.delete_object(Bucket=bucket,Key=key)
          print("R2 preflight PASS")
          PY

      - name: Preflight Development database connection
        run: |
          set -euo pipefail
          docker run --rm \
            -e DB_URL="${SUPABASE_DB_URL}" \
            postgres:17-alpine \
            sh -lc 'test "$(psql "$DB_URL" -X -v ON_ERROR_STOP=1 -Atc "select 1")" = "1"'
          echo "Development database preflight PASS"

      - name: Create consistent PostgreSQL custom-format backup
        run: |
          set -euo pipefail
          mkdir -p tmp/p8-storage-pgdump
          docker run --rm \
            -e DB_URL="${SUPABASE_DB_URL}" \
            -v "${PWD}/tmp/p8-storage-pgdump:/backup" \
            postgres:17-alpine \
            sh -lc 'pg_dump "$DB_URL" --format=custom --compress=3 --no-owner --no-privileges \
              --table=public.p8_b3_raw_market_price_observations \
              --table=public.p8_historical_listing_observations_v3 \
              --table=public.p8_historical_universe_member_listing_evidence_v3 \
              --table=public.p8_historical_universe_members_v3 \
              --file=/backup/portfolioai-p8-large-relations-2026-10-02.dump'

      - name: Validate archive structure and exact dump row counts
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/tmp/p8-storage-pgdump:/backup" \
            postgres:17-alpine \
            pg_restore --list /backup/portfolioai-p8-large-relations-2026-10-02.dump \
            > tmp/p8-storage-pgdump/pg_restore.list

          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          root=Path("tmp/p8-storage-pgdump")
          dump="/backup/portfolioai-p8-large-relations-2026-10-02.dump"
          expected={
              "p8_b3_raw_market_price_observations":532575,
              "p8_historical_listing_observations_v3":562790,
              "p8_historical_universe_member_listing_evidence_v3":562790,
              "p8_historical_universe_members_v3":144768,
          }
          counts={k:0 for k in expected}
          mount=f"{os.getcwd()}/tmp/p8-storage-pgdump:/backup"
          proc=subprocess.Popen(
              ["docker","run","--rm","-v",mount,"postgres:17-alpine",
               "pg_restore","--data-only","--file=-",dump],
              stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1
          )
          current=None
          copy_re=re.compile(r"^COPY public\.([A-Za-z0-9_]+) \(")
          assert proc.stdout is not None
          for line in proc.stdout:
              m=copy_re.match(line)
              if m:
                  current=m.group(1) if m.group(1) in counts else None
                  continue
              if current and line.rstrip("\n")==r"\.":
                  current=None
                  continue
              if current:
                  counts[current]+=1
          stderr=proc.stderr.read() if proc.stderr else ""
          rc=proc.wait()
          if rc!=0:
              raise SystemExit(f"pg_restore data validation failed ({rc}): {stderr[-4000:]}")
          if counts!=expected:
              raise SystemExit(f"EXACT_DUMP_COUNT_MISMATCH expected={expected} actual={counts}")
          (root/"source-counts.json").write_text(
              json.dumps(counts,sort_keys=True,separators=(",",":"))+"\n"
          )
          print(json.dumps({"status":"PASS","validation":"PG_RESTORE_DATA_STREAM_EXACT_COUNTS","counts":counts}))
          PY

          sha256sum tmp/p8-storage-pgdump/portfolioai-p8-large-relations-2026-10-02.dump \
            > tmp/p8-storage-pgdump/portfolioai-p8-large-relations-2026-10-02.dump.sha256

      - name: Upload to R2 and download-readback verify SHA-256
        run: |
          python - <<'PY'
          import boto3, hashlib, json, os
          from pathlib import Path
          from botocore.config import Config
          from boto3.s3.transfer import TransferConfig

          root=Path("tmp/p8-storage-pgdump")
          dump=root/"portfolioai-p8-large-relations-2026-10-02.dump"
          counts=root/"source-counts.json"
          listing=root/"pg_restore.list"
          sidecar=root/"portfolioai-p8-large-relations-2026-10-02.dump.sha256"
          bucket=os.environ["CLOUDFLARE_R2_BUCKET"]
          prefix="portfolioai-history/development/p8/rescue-backup-v1"

          s3=boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["CLOUDFLARE_R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["CLOUDFLARE_R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(
                  retries={"max_attempts":10,"mode":"adaptive"},
                  connect_timeout=30,
                  read_timeout=180,
                  s3={"addressing_style":"path"},
              ),
          )
          transfer=TransferConfig(
              multipart_threshold=64*1024*1024,
              multipart_chunksize=64*1024*1024,
              max_concurrency=4,
              use_threads=True,
          )

          def sha(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda:f.read(4*1024*1024),b""):
                      h.update(block)
              return h.hexdigest()

          def put_verify(path,key,ctype):
              local=sha(path)
              s3.upload_file(
                  str(path),bucket,key,
                  ExtraArgs={"ContentType":ctype,"Metadata":{"sha256":local}},
                  Config=transfer,
              )
              rb=root/("readback-"+path.name)
              s3.download_file(bucket,key,str(rb),Config=transfer)
              remote=sha(rb)
              rb.unlink()
              if remote!=local:
                  raise RuntimeError(f"R2_SHA256_MISMATCH {key}")
              head=s3.head_object(Bucket=bucket,Key=key)
              if int(head["ContentLength"])!=path.stat().st_size:
                  raise RuntimeError(f"R2_SIZE_MISMATCH {key}")
              return {"key":key,"bytes":path.stat().st_size,"sha256":local}

          evidence={}
          evidence["dump"]=put_verify(dump,f"{prefix}/{dump.name}","application/octet-stream")
          evidence["dump_sha256"]=put_verify(sidecar,f"{prefix}/{sidecar.name}","text/plain")
          evidence["source_counts"]=put_verify(counts,f"{prefix}/{counts.name}","application/json")
          evidence["archive_listing"]=put_verify(listing,f"{prefix}/{listing.name}","text/plain")

          manifest={
              "status":"PASS",
              "backup_version":"P8_RESCUE_PGDUMP_V1",
              "source_environment":"PortfolioAI Dev / lrgpjimipfkyoqbpsqzz",
              "tables":[
                  "p8_b3_raw_market_price_observations",
                  "p8_historical_listing_observations_v3",
                  "p8_historical_universe_member_listing_evidence_v3",
                  "p8_historical_universe_members_v3",
              ],
              "source_counts":json.loads(counts.read_text()),
              "objects":evidence,
              "restore_tool":"PostgreSQL 17 pg_restore",
              "r2_bucket":bucket,
              "verification":"UPLOAD_PLUS_FULL_DOWNLOAD_READBACK_SHA256",
          }
          mf=root/"COMPLETE.json"
          mf.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          complete_ev=put_verify(mf,f"{prefix}/COMPLETE.json","application/json")
          print(json.dumps({
              "status":"PASS",
              "complete_manifest":complete_ev,
              "dump":evidence["dump"],
              "source_counts":manifest["source_counts"],
          },indent=2,sort_keys=True))
          PY

      - name: Publish non-sensitive completion evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8-rescue-pgdump-backup-completion
          path: |
            tmp/p8-storage-pgdump/COMPLETE.json
            tmp/p8-storage-pgdump/source-counts.json
            tmp/p8-storage-pgdump/pg_restore.list
            tmp/p8-storage-pgdump/portfolioai-p8-large-relations-2026-10-02.dump.sha256
          if-no-files-found: error
          retention-days: 30

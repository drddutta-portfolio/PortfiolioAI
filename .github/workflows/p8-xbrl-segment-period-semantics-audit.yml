name: P8 XBRL Segment Period Semantics Audit
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - scripts/p8/p8-xbrl-segment-period-semantics-audit.py
      - scripts/p8/test-p8-xbrl-segment-period-semantics-audit.py
      - .github/workflows/p8-xbrl-segment-period-semantics-audit.yml
permissions:
  contents: write
concurrency:
  group: p8-xbrl-segment-period-semantics-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: PortfolioAI-Development}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --no-cache-dir "boto3==1.40.46" "lxml==6.0.2"
      - name: Semantic evidence tests
        run: python scripts/p8/test-p8-xbrl-segment-period-semantics-audit.py
      - name: Source semantics matrix and frozen canary rerun
        run: python scripts/p8/p8-xbrl-segment-period-semantics-audit.py
      - name: Commit audit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/p8/PortfolioAI_P8_XBRL_SEGMENT_PERIOD_SOURCE_SEMANTICS_MATRIX_2026-10-04.json docs/p8/PortfolioAI_P8_XBRL_SEGMENT_PERIOD_FROZEN_CANARY_RERUN_2026-10-04.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(p8): evaluate XBRL segment-period semantics"
            git pull --rebase origin PortfolioAI-Development
            git push origin HEAD:PortfolioAI-Development
          fi

name: R1 D35B Verification

on:
  push:
    branches:
      - r1-d35b-position-sizing-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-r1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: R1 position sizing tests
        run: npx vitest run src/features/portfolio/positionSizingEngine.test.ts

      - name: Targeted R1 typecheck
        run: npx tsc --ignoreConfig --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler src/features/portfolio/positionSizingEngine.ts src/features/portfolio/positionSizingEngine.test.ts

      - name: Targeted R1 lint
        run: npx eslint src/features/portfolio/positionSizingEngine.ts src/features/portfolio/positionSizingEngine.test.ts

      - name: Repository typecheck diagnostic
        continue-on-error: true
        run: npm run typecheck

      - name: Repository lint diagnostic
        continue-on-error: true
        run: npm run lint

      - name: Repository build diagnostic
        continue-on-error: true
        run: npm run build

  verify-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start disposable local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Reset disposable database through migrations
        run: supabase db reset

      - name: Run R1 pgTAP contract
        run: supabase test db supabase/tests/r1_d35b_position_sizing_assessments_test.sql

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup

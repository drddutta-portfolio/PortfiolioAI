name: R1 D35B Verification

on:
  push:
    branches:
      - r1-d35b-position-sizing-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-r1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: R1 position sizing tests
        run: npx vitest run src/features/portfolio/positionSizingEngine.test.ts

      - name: Targeted R1 typecheck
        run: npx tsc --ignoreConfig --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler src/features/portfolio/positionSizingEngine.ts src/features/portfolio/positionSizingEngine.test.ts

      - name: Targeted R1 lint
        run: npx eslint src/features/portfolio/positionSizingEngine.ts src/features/portfolio/positionSizingEngine.test.ts

      - name: Repository typecheck diagnostic
        continue-on-error: true
        run: npm run typecheck

      - name: Repository lint diagnostic
        continue-on-error: true
        run: npm run lint

      - name: Repository build diagnostic
        continue-on-error: true
        run: npm run build

  verify-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/supabase/postgres:17.6.1.167
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 54322
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Bootstrap only R1 prerequisite schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgtap with schema extensions;
          create table public.portfolios (id uuid primary key default gen_random_uuid(), user_id uuid not null);
          create table public.securities (id uuid primary key default gen_random_uuid());
          create table public.stock_score_runs (id uuid primary key default gen_random_uuid());
          create table public.stock_recommendation_runs (id uuid primary key default gen_random_uuid());
          SQL

      - name: Apply R1 migration in disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260913235000_create_position_sizing_assessments.sql

      - name: Run R1 pgTAP contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/r1_d35b_position_sizing_assessments_test.sql

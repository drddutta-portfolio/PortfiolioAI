name: R1-R4 repository verification

on:
  push:
    branches: [PortfolioAI-Development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:edge
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Deno handler tests
        run: >-
          deno test --allow-env --allow-net=esm.sh
          supabase/functions/complete-research-refresh/index.deno.test.ts
          supabase/functions/p7-ic2-materialize-readiness/index.deno.test.ts
      - run: npm run test:edge
      - run: npm run build
      - run: git diff --check HEAD^ HEAD

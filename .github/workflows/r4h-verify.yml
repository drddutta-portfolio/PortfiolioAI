name: R4H Final Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: R4H targeted tests
        run: >-
          npx vitest run
          src/features/research/pharmaHistoryNormalization.test.ts
          src/features/research/pharmaStoredDiscoveryParser.test.ts
          src/features/research/pharmaPeriodIdentity.test.ts
          src/features/research/pharmaCanonicalHistoryPilot.test.ts
          src/features/research/pharmaCanonicalHistoryManifest.test.ts
          src/features/research/pharmaSourceReadiness.test.ts
          src/features/research/pharmaReadinessViewModel.test.ts
      - name: R4H targeted lint
        run: >-
          npx eslint
          src/features/research/pharmaHistoryNormalization.ts
          src/features/research/pharmaHistoryNormalization.test.ts
          src/features/research/pharmaStoredDiscoveryParser.ts
          src/features/research/pharmaStoredDiscoveryParser.test.ts
          src/features/research/pharmaPeriodIdentity.ts
          src/features/research/pharmaPeriodIdentity.test.ts
          src/features/research/pharmaCanonicalHistoryPilot.ts
          src/features/research/pharmaCanonicalHistoryPilot.test.ts
          src/features/research/pharmaCanonicalHistoryManifest.test.ts
          src/features/research/pharmaHistoryMetricDefinitions.ts
          src/features/research/pharmaSourceReadiness.ts
          src/features/research/pharmaSourceReadiness.test.ts
          src/features/research/pharmaReadinessViewModel.ts
          src/features/research/pharmaReadinessViewModel.test.ts
      - name: Architecture guard
        run: npm run check:architecture
      - name: Architecture lint
        run: npm run lint:architecture
      - name: Repository typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

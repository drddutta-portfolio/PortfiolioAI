name: Results R3 2024 Missing-Quarter Original Recovery
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r3-2024-gap-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: results-r3-2024-compact-original-source-dev
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R3_2024_STOCK_LIMIT: "262"
      RESULTS_R3_2024_SYMBOLS: "ASTRAL,BEL,HDFCBANK"
      RESULTS_R3_2024_ACK: "2024_SEP_DEC_COMPACT_XBRL"
      RESULTS_R3_2024_DRY_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce Development-only storage and authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == "portfolioai-history-dev" ]] || exit 1
          for key in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY; do test -n "${!key:-}" || exit 1; done
      - name: Install exact collector dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3==1.40.46' 'psycopg[binary]==3.2.10' 'requests==2.32.5' 'beautifulsoup4==4.13.5'
      - name: Parse and R4 verification regressions
        run: |
          python -m py_compile scripts/results/r3-legacy-2024-compact.py
          python scripts/results/test_r5_legacy_2024_xbrl.py -v
          env -u RESULTS_R5_LEGACY_SELECTION -u RESULTS_R5_LEGACY_ACK python scripts/results/test_r4_verify_quarterly.py -v
      - name: Reuse selected historical data and acquire original gaps only
        run: |
          set -euo pipefail
          mkdir -p tmp/r3-2024
          python scripts/results/r3-legacy-2024-compact.py > tmp/r3-2024/acquisition.json
          python - <<'PY'
          import json
          r=json.load(open('tmp/r3-2024/acquisition.json'))
          assert r.get('blocked') is None
          assert r.get('target_periods')==['2024-09-30','2024-12-31']
          print(json.dumps({k:r.get(k) for k in ['checked','qualified','observations_inserted','periods','failures','blocked']},sort_keys=True))
          PY
      - name: R4 original R2 verification and selected-fact readback
        env:
          RESULTS_R5_LEGACY_SELECTION: '1'
          RESULTS_R5_LEGACY_ACK: '2024_SEP_DEC_ORIGINAL_XBRL'
        run: |
          set -euo pipefail
          python scripts/results/r4-verify-quarterly.py --apply
          cp tmp/results-r4/readback.json tmp/r3-2024/selection.json
          python - <<'PY'
          import json
          x=json.load(open('tmp/r3-2024/selection.json'))
          print(json.dumps({k:x.get(k) for k in ['created_decisions','unchanged_decisions','conflicting_existing_decisions','qualified_fact_rows','exceptions']},sort_keys=True))
          assert x.get('conflicting_existing_decisions')==0
          PY
      - name: Persist non-sensitive run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-2024-compact-issuer-source-readback
          path: tmp/r3-2024/*.json
          retention-days: 21
          if-no-files-found: warn

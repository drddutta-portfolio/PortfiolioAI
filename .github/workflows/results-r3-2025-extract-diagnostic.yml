name: Results R3 2025 Original Parser Diagnostic
on:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r3-2025-extract-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3==1.40.46' 'psycopg[binary]==3.2.10' 'requests==2.32.5' 'beautifulsoup4==4.13.5'
      - name: Reproduce metadata-to-original qualification for three companies
        run: |
          python - <<'PY'
          import importlib.util,os,requests,json
          spec=importlib.util.spec_from_file_location('src',os.path.join('scripts','results','r3-live-public-filing-batch.py'))
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; PortfolioAIResearch/1.0)','Accept-Language':'en-IN,en;q=0.8'})
          s.get('https://www.nseindia.com/companies-listing/corporate-integrated-filing',timeout=25)
          m.R5_HISTORY_MODE=True
          for name,isin in [('CIPLA','INE059A01026'),('INFY','INE009A01021'),('HDFCBANK','INE040A01034')]:
            records=m.fetch_json(s,name)
            links=m.listing_urls(records,name)
            matches=records if isinstance(records,list) else records.get('data',[])
            print('CATALOG',name,'items',len(matches),'valid_links',len(links))
            import xml.etree.ElementTree as ET
            old_records=[a for a in matches if isinstance(a,dict) and str(a.get('qe_Date','')).upper() in ('31-MAR-2025','30-JUN-2025')]
            for entry in old_records[:2]:
              url=entry.get('xbrl')
              if not isinstance(url,str) or not url.startswith('https://nsearchives.nseindia.com/corporate/xbrl/'): continue
              xml=s.get(url,timeout=25)
              print('XML_FETCH',name,entry.get('qe_Date'),xml.status_code,len(xml.content),xml.headers.get('content-type'))
              if xml.ok:
                try:
                  root=ET.fromstring(xml.content)
                  print('XML_SHAPE',name,root.tag,'elements',len(root),'first_tags',[node.tag.rsplit('}',1)[-1] for node in list(root)[:12]])
                  from pathlib import Path
                  spec2=importlib.util.spec_from_file_location('legacy',os.path.join('scripts','results','r3-legacy-2025-xbrl.py'))
                  legacy=importlib.util.module_from_spec(spec2);spec2.loader.exec_module(legacy)
                  strings={}
                  for e in root.iter():
                    tag=e.tag.rsplit('}',1)[-1]
                    if tag in ('ISIN','Symbol','NSESymbol') and e.text: strings.setdefault(tag,set()).add(e.text.strip())
                  print('XML_IDENTITIES',name,{k:sorted(v)[:3] for k,v in strings.items()})
                  end='2025-06-30' if entry.get('qe_Date')=='30-JUN-2025' else '2025-03-31'
                  meta={'symbol':name,'isin':sorted(strings.get('ISIN',[]))[0] if len(strings.get('ISIN',[]))==1 else None,
                    'fromDate':'01-Apr-2025' if end=='2025-06-30' else '01-Jan-2025',
                    'toDate':'30-Jun-2025' if end=='2025-06-30' else '31-Mar-2025',
                    'consolidated':entry.get('consolidated')}
                  parsed,err=legacy.extract(xml.content,meta,name,meta.get('isin'))
                  print('LEGACY_XML_PARSER',name,end,'scope',meta['consolidated'],
                    sorted(parsed.get('facts',{})) if parsed else [],err)
                except ET.ParseError as e: print('XML_UNPARSEABLE',name,str(e)[:100])
            for link in links[:3]:
              try:
                z=s.get(link,timeout=25)
                if not z.ok: print('FETCH',name,z.status_code);continue
                parsed,reason=m.extract_source(z.text,name,isin,link)
                from bs4 import BeautifulSoup
                soup=BeautifulSoup(z.text,'html.parser')
                snippets=[]
                for rows in m.html_rows(soup):
                  for row in rows:
                    if any('rounding' in str(c).lower() or 'in lakhs' in str(c).lower() or 'in crores' in str(c).lower() or 'in millions' in str(c).lower() for c in row):
                      snippets.append([str(c)[:100] for c in row[:5]])
                print('BODY',name,'bytes',len(z.content),'type',z.headers.get('content-type'), 'start',z.text[:90].replace('\\n',' '))
                print('UNIT_ROWS',name,json.dumps(snippets[:5]))
                print('EXTRACT',name,parsed.get('period_end') if parsed else None,sorted(parsed.get('facts',{})) if parsed else [],reason)
              except Exception as e: print('ERROR',name,type(e).__name__,str(e)[:100])
          PY

name: Results R3 2025 Original Finance & Operating Gaps
on:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r3-2025-nonbank-gaps.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: results-r3-2025-nonbank-gap-source-development
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R3_2025_STOCK_LIMIT: '262'
      RESULTS_R3_2025_SYMBOLS: 'ANGELONE,CHOLAFIN,CGCL,HUDCO,IREDA,SHRIRAMFIN,STARHEALTH,TDPOWERSYS,360ONE,UTIAMC,MFSL,MUTHOOTFIN'
      RESULTS_R3_2025_LEGACY_ACK: '2025_MAR_JUN_ORIGINAL_XBRL'
      RESULTS_R3_2025_DRY_RUN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authorized Development source and storage
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
          for key in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY; do test -n "${!key:-}" || exit 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original issuer source collector
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3==1.40.46' 'psycopg[binary]==3.2.10' 'requests==2.32.5' 'beautifulsoup4==4.13.5'
      - name: Verify collector source and historical selection contract
        run: |
          python -m py_compile scripts/results/r3-legacy-2025-xbrl.py
          python scripts/results/test_r5_legacy_2024_xbrl.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
      - name: Acquire only original 2025 gaps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/r3-finance-2025
          python scripts/results/r3-legacy-2025-xbrl.py > tmp/r3-finance-2025/acquisition.json
          python - <<'PY'
          import json
          a=json.load(open('tmp/r3-finance-2025/acquisition.json'))
          print(json.dumps({k:a.get(k) for k in ('checked','qualified','observations_inserted','periods','failures','blocked')},sort_keys=True))
          assert a['blocked'] is None
          PY
      - name: Canonical historical source selection
        env:
          RESULTS_R5_COMPARISON_SELECTION: '1'
          RESULTS_R5_HISTORICAL_ACK: '2025_MAR_JUN_ONLY'
        run: |
          set -euo pipefail
          python scripts/results/r4-verify-quarterly.py --apply
          cp tmp/results-r4/readback.json tmp/r3-finance-2025/selection.json
          python - <<'PY'
          import json
          r=json.load(open('tmp/r3-finance-2025/selection.json'))
          print(json.dumps({k:r.get(k) for k in ('created_decisions','conflicting_existing_decisions','exceptions')},sort_keys=True))
          assert r['conflicting_existing_decisions']==0
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r3-2025-finance-original-readback
          path: tmp/r3-finance-2025/*.json
          retention-days: 21
          if-no-files-found: warn

name: Results R3 2025 Source Admission Replay
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r3-2025-source-admission-replay.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: results-r3-2025-selection-admission-dev
  cancel-in-progress: false
jobs:
  verify-and-select:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R5_HISTORICAL_ACK: "2025_MAR_JUN_ONLY"
      RESULTS_R5_COMPARISON_SELECTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce Development-only credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
          for key in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY; do test -n "${!key:-}" || exit 1; done
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3==1.40.46' 'psycopg[binary]==3.2.10'
      - name: Source contract regressions
        run: |
          python scripts/results/test_r4_verify_quarterly.py -v
          python -m py_compile scripts/results/r4-verify-quarterly.py
      - name: Validate R2 hashes and select 2025 original evidence
        run: |
          set -euo pipefail
          mkdir -p tmp/results-r3-2025-replay
          python scripts/results/r4-verify-quarterly.py --apply
          cp tmp/results-r4/readback.json tmp/results-r3-2025-replay/selection.json
          python - <<'PY'
          import json
          v=json.load(open('tmp/results-r3-2025-replay/selection.json'))
          print(json.dumps({k:v.get(k) for k in ('created_decisions','unchanged_decisions','conflicting_existing_decisions','qualified_fact_rows','selected_stock_quarters','r2_sources_checked','exceptions')},sort_keys=True))
          assert v['conflicting_existing_decisions']==0
          assert v['created_decisions']>0, 'Historical source selection did not advance'
          PY
      - name: Independently read back selected March and June 2025 facts
        run: |
          python - <<'PY'
          import psycopg,os,json
          with psycopg.connect(os.environ['SUPABASE_DB_URL']) as db:
            with db.cursor() as cur:
              cur.execute("""
               SELECT d.period_end::text,count(DISTINCT d.security_id),count(DISTINCT d.selected_observation_id)
               FROM public.fundamental_observation_decisions d
               WHERE d.period_type='QUARTER' AND d.selected_observation_id IS NOT NULL
                 AND d.period_end IN ('2025-03-31','2025-06-30')
               GROUP BY d.period_end ORDER BY d.period_end
              """)
              result=[{'period':p,'selected_stocks':n,'selected_facts':f} for p,n,f in cur.fetchall()]
              print(json.dumps(result,sort_keys=True))
              assert any(r['period']=='2025-06-30' and r['selected_stocks']>0 for r in result)
          PY
      - name: Archive non-secret verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r3-2025-selection-readback
          path: tmp/results-r3-2025-replay/*.json
          if-no-files-found: warn
          retention-days: 21

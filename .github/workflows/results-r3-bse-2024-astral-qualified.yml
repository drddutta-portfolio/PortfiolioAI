name: Results R3 BSE Astral 2024 Original Quarter Admission
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r3-bse-2024-astral-qualified.yml
      - scripts/results/r3-bse-2024-astral-pdf.py
permissions:
  contents: read
concurrency:
  group: results-r3-bse-astral-2024-admission-dev
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R3_BSE_ASTRAL_WRITE_ACK: ASTRAL_2024_ORIGINAL_TWO_PDF_PROOF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Enforce Development-only account and R2 bucket
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
          test -n "$CLOUDFLARE_R2_ACCESS_KEY_ID" && test -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
      - name: Install exact vendored BSE and persistence dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r vendor/bseindiaapi/requirements.txt 'pymupdf==1.26.5' 'psycopg[binary]==3.2.10' 'boto3==1.40.46'
      - name: Source-admission regressions
        run: |
          python -m py_compile scripts/results/r3-bse-2024-astral-pdf.py scripts/results/r4-verify-quarterly.py
          python scripts/results/test_portfolio_bse.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
      - name: Validate original Astral consolidated quarterly figures without writing
        run: |
          set -euo pipefail
          python scripts/results/r3-bse-2024-astral-pdf.py --output tmp/r3-bse-astral/dry.json
          python - <<'PY'
          import json
          a=json.load(open('tmp/r3-bse-astral/dry.json'))
          print(json.dumps(a,sort_keys=True))
          assert len(a['quarters'])==2
          assert all(x['status'] in ('ORIGINAL_PDF_FACTS_VALIDATED','EXISTING_QUALIFIED_REUSED') for x in a['quarters'])
          PY
      - name: Persist compact verified issuer-original financial facts
        run: python scripts/results/r3-bse-2024-astral-pdf.py --apply --output tmp/r3-bse-astral/acquisition.json
      - name: Apply historical R4 quarter source qualification
        env:
          RESULTS_R5_LEGACY_SELECTION: '1'
          RESULTS_R5_LEGACY_ACK: '2024_SEP_DEC_ORIGINAL_XBRL'
        run: |
          set -euo pipefail
          python scripts/results/r4-verify-quarterly.py --apply
          cp tmp/results-r4/readback.json tmp/r3-bse-astral/selection.json
          python - <<'PY'
          import json
          x=json.load(open('tmp/r3-bse-astral/selection.json'))
          print(json.dumps({k:x.get(k) for k in ('created_decisions','unchanged_decisions','conflicting_existing_decisions','exceptions')},sort_keys=True))
          assert x['conflicting_existing_decisions']==0
          PY
      - name: Independent selected-quarter canonical readback
        run: |
          python - <<'PY'
          import json,psycopg,os
          with psycopg.connect(os.environ['SUPABASE_DB_URL'],options='-c default_transaction_read_only=on') as db:
            with db.cursor() as cur:
              cur.execute("""
                SELECT d.period_end::text,COUNT(DISTINCT d.metric_code),array_agg(d.metric_code ORDER BY d.metric_code)
                FROM public.fundamental_observation_decisions d JOIN public.securities s ON s.id=d.security_id
                WHERE s.symbol='ASTRAL' AND d.period_end IN ('2024-09-30','2024-12-31')
                  AND d.period_type='QUARTER' AND d.selected_observation_id IS NOT NULL
                GROUP BY d.period_end ORDER BY d.period_end
              """)
              found=[{'period':p,'metrics':n,'codes':metrics} for p,n,metrics in cur.fetchall()]
              print('ASTRAL_2024_CANONICAL_READBACK='+json.dumps(found,sort_keys=True))
              assert len(found)==2 and all(row['metrics']>=3 for row in found)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-bse-astral-2024-original-qualified-readback
          path: tmp/r3-bse-astral/*.json
          if-no-files-found: warn
          retention-days: 21

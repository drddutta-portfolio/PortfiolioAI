name: Results R3 BSE HDFC 2024 Original Quarterly Admission
on:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r3-bse-2024-hdfc-qualified.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: results-r3-bse-2024-hdfc-original-admission-dev
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R3_BSE_2024_WRITE_ACK: BSE_HDFCBANK_2024_TWO_SOURCE_PROOF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify Development-only target and credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
          test -n "$CLOUDFLARE_R2_ACCESS_KEY_ID" && test -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
      - name: Install exact dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r vendor/bseindiaapi/requirements.txt 'pymupdf==1.26.5' 'psycopg[binary]==3.2.10' 'boto3==1.40.46'
      - name: Compile parser, verify BSE adapter and source regressions
        run: |
          python -m py_compile scripts/results/r3-bse-2024-original-pdf.py scripts/results/r4-verify-quarterly.py
          python scripts/results/test_portfolio_bse.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
      - name: Verify both historic original issuer statements without writing
        run: |
          set -euo pipefail
          python scripts/results/r3-bse-2024-original-pdf.py --output tmp/results-r3-bse-2024/dry.json
          python - <<'PY'
          import json
          x=json.load(open('tmp/results-r3-bse-2024/dry.json'))
          print(json.dumps(x,sort_keys=True))
          assert len(x['outcomes'])==2
          assert all(v['status'] in ('ORIGINAL_QUALIFIED_FOR_R4','EXISTING_QUALIFIED_REUSED') for v in x['outcomes'])
          assert x['observations_inserted']==0
          PY
      - name: Persist original-PDF compact financial facts in Development only
        run: |
          set -euo pipefail
          python scripts/results/r3-bse-2024-original-pdf.py --apply --output tmp/results-r3-bse-2024/acquisition.json
      - name: Canonical R4 historical source and exact financial-row qualification
        env:
          RESULTS_R5_LEGACY_SELECTION: '1'
          RESULTS_R5_LEGACY_ACK: '2024_SEP_DEC_ORIGINAL_XBRL'
        run: |
          set -euo pipefail
          python scripts/results/r4-verify-quarterly.py --apply
          cp tmp/results-r4/readback.json tmp/results-r3-bse-2024/selection.json
          python - <<'PY'
          import json
          r=json.load(open('tmp/results-r3-bse-2024/selection.json'))
          print(json.dumps({k:r.get(k) for k in ('created_decisions','unchanged_decisions','conflicting_existing_decisions','invalid_evidence','exceptions')},sort_keys=True))
          assert r['conflicting_existing_decisions']==0
          PY
      - name: Independent readback of actual selected historical financial trios
        run: |
          python - <<'PY'
          import os,json,psycopg
          with psycopg.connect(os.environ['SUPABASE_DB_URL'],options='-c default_transaction_read_only=on') as db:
            with db.cursor() as cur:
              cur.execute("""
               SELECT d.period_end::text,count(distinct d.metric_code),array_agg(d.metric_code ORDER BY d.metric_code)
               FROM public.fundamental_observation_decisions d JOIN public.securities s ON s.id=d.security_id
               WHERE s.symbol='HDFCBANK' AND d.period_type='QUARTER'
                 AND d.period_end IN ('2024-09-30','2024-12-31') AND d.selected_observation_id IS NOT NULL
               GROUP BY d.period_end ORDER BY d.period_end
              """)
              rows=[{'period':x,'metrics':n,'codes':codes} for x,n,codes in cur.fetchall()]
              print('HDFC_BSE_2024_SELECTED='+json.dumps(rows,sort_keys=True))
              assert len(rows)==2 and all(v['metrics']>=3 for v in rows)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r3-bse-hdfcbank-2024-source-and-selection-readback
          path: tmp/results-r3-bse-2024/*.json
          retention-days: 21
          if-no-files-found: warn

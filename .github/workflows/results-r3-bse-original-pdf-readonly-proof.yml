name: Results R3 BSE Original 2024 PDF Retrieval Proof
on:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r3-bse-original-pdf-readonly-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir 'bse==3.3.3'
      - name: Probe official BSE original filing attachments from verified September and December 2024 results
        run: |
          python - <<'PY'
          import json, hashlib, re
          from bse import BSE
          # Filenames come from authenticated upstream-public BSE announcements in previous live proof.
          sources=[
            ('HDFCBANK','2024-09-30','c9b4cb4c-088b-4a88-a6b7-91087ba90d95.pdf'),
            ('HDFCBANK','2024-12-31','8e326f69-8061-4281-bc39-d8ac639479bd.pdf')
          ]
          with BSE(download_folder='/tmp') as bse:
            for symbol,quarter,filename in sources:
              assert re.fullmatch(r'[a-f0-9-]{36}\.pdf',filename)
              result={'symbol':symbol,'quarter':quarter,'original_attachment':filename,'checks':[]}
              for folder in ('AttachLive','AttachHis'):
                url='https://www.bseindia.com/xml-data/corpfiling/'+folder+'/'+filename
                try:
                  response=bse.session.get(url,timeout=18,stream=True)
                  entry={'source_url':url,'status':response.status_code,'content_type':response.headers.get('content-type','')[:65]}
                  if response.ok:
                    sha=hashlib.sha256();size=0;first=b''
                    for block in response.iter_content(chunk_size=65536):
                      if not block: continue
                      if not first:first=block[:6]
                      size+=len(block)
                      if size>12_000_000:break
                      sha.update(block)
                    entry.update({'first_bytes_pdf':first.startswith(b'%PDF-'),
                      'bytes_read':size,'size_limit_hit':size>12_000_000})
                    if first.startswith(b'%PDF-') and size<=12_000_000:
                      entry['sha256']=sha.hexdigest()
                  response.close()
                  result['checks'].append(entry)
                  if entry.get('sha256'):break
                except Exception as e:
                  result['checks'].append({'source_url':url,'error':type(e).__name__+' '+str(e)[:90]})
              print('BSE_ORIGINAL_PDF_PROOF='+json.dumps(result,sort_keys=True),flush=True)
          PY

name: Results R3 BSE Vendored Integration and Live Proof
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - vendor/bseindiaapi/**
      - scripts/portfolio_bse.py
      - scripts/results/r3-bse-source-discovery.py
      - scripts/results/test_portfolio_bse.py
      - .github/workflows/results-r3-bse-vendored-integration.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: results-r3-vendored-bse-development
  cancel-in-progress: false
jobs:
  bse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies of our vendored library (not PyPI bse)
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r vendor/bseindiaapi/requirements.txt
          python -m pip show mthrottle requests
      - name: Verify vendored package identity and Python source integrity
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from portfolio_bse import _VENDOR_SRC
          from bse import BSE
          from pathlib import Path
          expected = Path('vendor/bseindiaapi/src').resolve()
          assert _VENDOR_SRC.resolve() == expected
          assert Path(sys.modules[BSE.__module__].__file__).resolve().is_relative_to(expected)
          assert BSE.version == '3.3.3'
          print('VENDORED_BSE_SOURCE='+str(Path(sys.modules[BSE.__module__].__file__).resolve()))
          PY
      - name: Compile Python modules and run isolated regression tests
        run: |
          python -m py_compile vendor/bseindiaapi/src/bse/BSE.py scripts/portfolio_bse.py scripts/results/r3-bse-source-discovery.py
          python scripts/results/test_portfolio_bse.py -v
      - name: Live BSE original 2024 financial filing discovery (Development only, read-only)
        run: |
          set -euo pipefail
          mkdir -p tmp/results-r3-bse
          python scripts/results/r3-bse-source-discovery.py \
            --targets 'ASTRAL:532830,BEL:500049,HDFCBANK:500180' \
            --from-date 2024-10-01 --to-date 2024-11-30 \
            --max-pages 3 --pdf-hash-limit 1 \
            --out tmp/results-r3-bse/sep2024.json
          python scripts/results/r3-bse-source-discovery.py \
            --targets 'ASTRAL:532830,BEL:500049,HDFCBANK:500180' \
            --from-date 2025-01-01 --to-date 2025-02-28 \
            --max-pages 3 --pdf-hash-limit 1 \
            --out tmp/results-r3-bse/dec2024.json
          python - <<'PY'
          import json
          from pathlib import Path
          results=[json.loads(x.read_text()) for x in Path('tmp/results-r3-bse').glob('*.json')]
          assert len(results)==2
          assert all(v['read_only'] and v['qualification_status']=='NOT_SELECTED_OR_PERSISTED'
            for v in results)
          hits=sum(len(x['results']) for a in results for x in a['targets'])
          hashes=sum(bool(x.get('sha256')) for a in results for z in a['targets']
            for x in z.get('pdf_evidence',[]))
          print(json.dumps({'historical_filing_hits':hits,'original_pdf_hashes':hashes,
              'snapshots_selected':0,'database_rows_written':0},sort_keys=True))
          assert hits>0, 'No historical original BSE filings discovered'
          assert hashes>0, 'No original BSE PDF hashes verified'
          PY
      - name: Retain non-secret discovery-only metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-vendored-bse-live-2024-original-discovery
          path: tmp/results-r3-bse/*.json
          if-no-files-found: warn
          retention-days: 21

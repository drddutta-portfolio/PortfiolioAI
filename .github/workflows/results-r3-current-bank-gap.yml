name: Results R3 Current-Quarter Bank Original Recovery
on:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r3-current-bank-gap.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: results-r3-current-bank-originals-development
  cancel-in-progress: false
jobs:
  recover-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R3_CURRENT_STOCK_LIMIT: '262'
      RESULTS_R3_CURRENT_SYMBOLS: 'BANKINDIA,CANBK,RBLBANK,UNIONBANK'
      RESULTS_R3_CURRENT_ACK: 'FOUR_CURRENT_ORIGINAL_XBRL'
      RESULTS_R3_CURRENT_DRY_RUN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce Development-only source binding
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
          for key in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY; do test -n "${!key:-}" || exit 1; done
      - name: Install source and evidence dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3==1.40.46' 'psycopg[binary]==3.2.10' 'requests==2.32.5' 'beautifulsoup4==4.13.5'
      - name: Baseline original XBRL and R4 source authority tests
        run: |
          python -m py_compile scripts/results/r3-current-quarter-integrated-xbrl.py
          python scripts/results/test_r5_legacy_2024_xbrl.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
      - name: Reuse existing selected facts and collect only missing current quarters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/r3-current-banks
          python scripts/results/r3-current-quarter-integrated-xbrl.py > tmp/r3-current-banks/acquisition.json
          python - <<'PY'
          import json
          r=json.load(open('tmp/r3-current-banks/acquisition.json'))
          print(json.dumps({k:r.get(k) for k in ['checked','qualified','observations_inserted','periods','failures','blocked']},sort_keys=True))
          assert r['blocked'] is None
          PY
      - name: Apply existing canonical source verifier without scope relaxation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/results/r4-verify-quarterly.py --apply
          cp tmp/results-r4/readback.json tmp/r3-current-banks/selection.json
          python - <<'PY'
          import json
          r=json.load(open('tmp/r3-current-banks/selection.json'))
          print(json.dumps({k:r.get(k) for k in ['created_decisions','unchanged_decisions','conflicting_existing_decisions','exceptions']},sort_keys=True))
          assert r['conflicting_existing_decisions']==0
          PY
      - name: Independent quarterly readback for four banks
        run: |
          python - <<'PY'
          import psycopg,os,json
          with psycopg.connect(os.environ['SUPABASE_DB_URL'],options='-c default_transaction_read_only=on') as conn:
            with conn.cursor() as c:
              c.execute("""
               SELECT s.symbol,d.period_end::text,COUNT(DISTINCT d.metric_code)
               FROM public.fundamental_observation_decisions d JOIN public.securities s ON s.id=d.security_id
               WHERE s.symbol IN ('BANKINDIA','CANBK','RBLBANK','UNIONBANK')
                 AND d.selected_observation_id IS NOT NULL
                 AND d.period_end IN ('2025-09-30','2025-12-31','2026-03-31','2026-06-30')
               GROUP BY 1,2 ORDER BY 1,2
              """)
              print(json.dumps([{'symbol':a,'quarter':b,'metrics':n} for a,b,n in c.fetchall()]))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r3-current-bank-original-verification
          path: tmp/r3-current-banks/*.json
          retention-days: 21
          if-no-files-found: warn

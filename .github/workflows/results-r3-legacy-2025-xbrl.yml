name: Results R3 March-June 2025 Legacy XBRL Recovery
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r3-legacy-2025-xbrl.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: results-r3-2025-full-originals-dev
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R3_2025_STOCK_LIMIT: "262"
      RESULTS_R3_2025_LEGACY_ACK: "2025_MAR_JUN_ORIGINAL_XBRL"
      RESULTS_R3_2025_DRY_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strictly Development-only secrets
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
          for key in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY; do test -n "${!key:-}" || exit 1; done
      - name: Install pinned recovery dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3==1.40.46' 'psycopg[binary]==3.2.10' 'requests==2.32.5' 'beautifulsoup4==4.13.5'
      - name: Original XBRL, issuer identity and R4 source integrity regression
        run: |
          python scripts/results/test_r5_legacy_2024_xbrl.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
          python -m py_compile scripts/results/r3-legacy-2025-xbrl.py
      - name: Acquire original historical March June 2025 filings
        run: |
          set -euo pipefail
          mkdir -p tmp/results-r3-2025
          python scripts/results/r3-legacy-2025-xbrl.py > tmp/results-r3-2025/acquisition.json
          python - <<'PY'
          import json
          a=json.load(open('tmp/results-r3-2025/acquisition.json'))
          assert a['target_periods']==['2025-03-31','2025-06-30']
          assert a['blocked'] is None
          print(json.dumps({k:a.get(k) for k in ['universe_size','checked','qualified','observations_inserted','periods','failures','blocked']},sort_keys=True))
          PY
      - name: Select independently qualified historical sources
        env:
          RESULTS_R5_HISTORICAL_ACK: '2025_MAR_JUN_ONLY'
          RESULTS_R5_COMPARISON_SELECTION: "1"
        run: |
          set -euo pipefail
          python scripts/results/r4-verify-quarterly.py --apply
          mkdir -p tmp/results-r3-2025
          cp tmp/results-r4/readback.json tmp/results-r3-2025/selection.json
          python - <<'PY'
          import json
          a=json.load(open('tmp/results-r3-2025/selection.json'))
          assert a['conflicting_existing_decisions']==0
          print(json.dumps({k:a.get(k) for k in ['created_decisions','unchanged_decisions','r2_sources_checked','exceptions']},sort_keys=True))
          PY
      - name: Independent database readback of historical selections
        run: |
          python - <<'PY'
          import json,os,psycopg
          with psycopg.connect(os.environ['SUPABASE_DB_URL']) as db:
            with db.cursor() as cur:
              cur.execute("""
                SELECT f.period_end::text,count(DISTINCT f.security_id),count(DISTINCT d.security_id),
                  count(DISTINCT d.selected_observation_id)
                FROM public.fundamental_observations f
                LEFT JOIN public.fundamental_observation_decisions d ON d.selected_observation_id=f.id
                WHERE f.period_type='QUARTER' AND f.period_end IN ('2025-03-31','2025-06-30')
                GROUP BY f.period_end ORDER BY f.period_end
              """)
              print(json.dumps([{'quarter':q,'observed_stocks':n,'selected_stocks':s,'selected_facts':f} for q,n,s,f in cur.fetchall()]))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r3-2025-legacy-originals-readback
          path: tmp/results-r3-2025/*.json
          if-no-files-found: warn
          retention-days: 21

# R3 acquisition pilot replay after 2025 compact-XBRL R4 contract qualification fix.

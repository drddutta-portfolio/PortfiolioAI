name: Results R3 Development Official Filings Collection

on:
  workflow_dispatch:
    inputs:
      max_stocks:
        description: "Development equities to process (bounded and resumable)."
        type: choice
        required: true
        default: "262"
        options: ["12", "40", "262"]
  push:
    branches:
      - PortfolioAI-Development
      - results-r3-batch-scan-20261014
      - results-r4-exception-closure-20261014
      - results-r4-legacy-requalification-20261014
      - results-r4-old-isin-reacquisition-20261015
    paths:
      - scripts/results/r3-live-public-filing-batch.py
      - scripts/results/test_r3_live_public_filing_batch.py
      - scripts/results/r3-current-coverage-readback.py
      - scripts/results/r3-bse-current-snapshot.py
      - scripts/results/test_r3_bse_current_snapshot.py
      - .github/workflows/results-r3-original-filings-acquisition.yml

permissions:
  contents: read

concurrency:
  group: results-r3-original-filings-development
  cancel-in-progress: false

jobs:
  quarterly-data:
    name: acquire-and-readback-development-results
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      RESULTS_MAX_STOCKS: ${{ inputs.max_stocks || '262' }}
      RESULTS_TARGET_SYMBOLS: ${{ github.ref_name == 'results-r4-old-isin-reacquisition-20261015' && 'BECTORFOOD,KOTAKBANK,V2RETAIL' || (github.ref_name == 'results-r4-legacy-requalification-20261014' && 'HCLTECH,HDFCBANK' || (github.ref_name == 'results-r4-exception-closure-20261014' && 'BECTORFOOD,COFORGE,HBLENGINE,KOTAKBANK,SHAILY,V2RETAIL,VAML' || '')) }}
      RESULTS_R4_REQUALIFY: ${{ (github.ref_name == 'results-r4-legacy-requalification-20261014' || github.ref_name == 'results-r4-old-isin-reacquisition-20261015') && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed on missing or wrong-environment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_R2_BUCKET; do
            if [ -z "${!name:-}" ]; then echo "MISSING_CONFIGURATION: $name"; exit 1; fi
          done
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || { echo 'NOT_DEVELOPMENT_DATABASE'; exit 1; }
          [[ "$CLOUDFLARE_R2_BUCKET" == "portfolioai-history-dev" ]] || { echo 'NOT_DEVELOPMENT_R2_BUCKET'; exit 1; }
      - name: Install pinned collector dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'boto3==1.40.46' 'psycopg[binary]==3.2.10' \
            'requests==2.32.5' 'beautifulsoup4==4.13.5' 'mthrottle==0.0.2'
      - name: Verify parser, units, identity and source URL policy
        run: python scripts/results/test_r3_live_public_filing_batch.py -v
      - name: Verify vendored BSEIndiaApi parser refuses unsupported source and EPS claims
        run: python scripts/results/test_r3_bse_current_snapshot.py -v
      - name: BSE primary — acquire nonduplicate review-only quarter summary evidence
        # BSE summary never substitutes a qualified original or R4 selected quarter.
        # A BSE outage does not block official issuer/NSE fallback.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/results-r3
          python scripts/results/r3-bse-current-snapshot.py --apply --max-stocks 40 > tmp/results-r3/bse-review.json
          python - <<'PY'
          import json
          result=json.load(open("tmp/results-r3/bse-review.json"))
          print(json.dumps({k:result[k] for k in ("source","missing_equities","examined","companies_with_facts","new_review_facts")},sort_keys=True))
          PY
      - name: Inspect public NSE banking EPS source format (no database writes)
        continue-on-error: true
        run: python scripts/results/r3-diagnose-bank-eps.py
      - name: Run bounded NSE issuer-data acquisition to R2 then Supabase
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/results-r3
          python scripts/results/r3-live-public-filing-batch.py > tmp/results-r3/collection.json
          python -m json.tool tmp/results-r3/collection.json > /dev/null
          python - <<'PY'
          import json
          p=json.load(open("tmp/results-r3/collection.json"))
          print(json.dumps({k:p.get(k) for k in
              ("universe_target","visited","with_documents","documents_parsed",
               "observations_inserted","blocked")},sort_keys=True))
          PY
      - name: Source-verify and select only admissible quarterly originals
        # This immutable R2 evidence gate does NOT select unverified, conflicting
        # or absent filings. It refuses to overwrite previous R4 selections.
        if: ${{ !cancelled() && (github.ref_name == 'PortfolioAI-Development' || github.ref_name == 'results-r4-legacy-requalification-20261014' || github.ref_name == 'results-r4-old-isin-reacquisition-20261015') }}
        run: python scripts/results/r4-verify-quarterly.py --apply
      - name: Independently read back all 262 equities and four exact quarters
        if: always()
        shell: bash
        run: |
          mkdir -p tmp/results-r3
          python scripts/results/r3-current-coverage-readback.py > tmp/results-r3/coverage.json
          python - <<'PY'
          import json
          r=json.load(open("tmp/results-r3/coverage.json"))
          print(json.dumps({k:r[k] for k in ("equities","etfs_excluded","complete_equities","incomplete_equities","result")},sort_keys=True))
          PY
      - name: Enforce truthful R3 262-equity completion gate
        if: ${{ !cancelled() && github.ref_name == 'PortfolioAI-Development' }}
        run: python scripts/results/r3-current-coverage-readback.py --strict > tmp/results-r3/strict-coverage.json
      - name: Publish non-secret acquisition and source-verification readbacks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r3-official-source-acquisition
          path: |
            tmp/results-r3/collection.json
            tmp/results-r3/bse-review.json
            tmp/results-r3/coverage.json
            tmp/results-r3/strict-coverage.json
            tmp/results-r4/readback.json
          if-no-files-found: warn
          retention-days: 15

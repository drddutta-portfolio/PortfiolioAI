name: Results R3 Seven Proven Identities 2025 Baselines
on:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r3-seven-2025-history.yml]
permissions:
  contents: read
concurrency:
  group: results-r3-seven-2025-history-dev
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R3_2025_STOCK_LIMIT: '262'
      RESULTS_R3_2025_SYMBOLS: 'ARVINDFASN,ASHOKA,AURIONPRO,AVANTIFEED,DDEVPLSTIK,SANSERA,VMART'
      RESULTS_R3_2025_LEGACY_ACK: '2025_MAR_JUN_ORIGINAL_XBRL'
      RESULTS_R3_2025_DRY_RUN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Development-only guard
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3==1.40.46' 'psycopg[binary]==3.2.10' 'requests==2.32.5' 'beautifulsoup4==4.13.5'
      - name: Verify original XBRL source authority
        run: |
          python scripts/results/test_r5_legacy_2024_xbrl.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
      - name: Acquire March and June 2025 original filings
        run: |
          mkdir -p tmp/r3-seven-history
          python scripts/results/r3-legacy-2025-xbrl.py > tmp/r3-seven-history/acquisition.json
          python - <<'PY'
          import json
          x=json.load(open('tmp/r3-seven-history/acquisition.json'))
          print(json.dumps({k:x.get(k) for k in ('checked','qualified','observations_inserted','periods','failures','blocked')},sort_keys=True))
          assert x['blocked'] is None
          PY
      - name: Independently qualify original source and store selections
        env:
          RESULTS_R5_COMPARISON_SELECTION: '1'
          RESULTS_R5_HISTORICAL_ACK: '2025_MAR_JUN_ONLY'
        run: |
          python scripts/results/r4-verify-quarterly.py --apply
          mkdir -p tmp/r3-seven-history
          cp tmp/results-r4/readback.json tmp/r3-seven-history/selection.json
          python - <<'PY'
          import json
          x=json.load(open('tmp/r3-seven-history/selection.json'))
          assert x['conflicting_existing_decisions']==0
          print(json.dumps({k:x.get(k) for k in ('created_decisions','unchanged_decisions','exceptions')},sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r3-seven-2025-qualified-readback
          path: tmp/r3-seven-history/*.json
          retention-days: 21
          if-no-files-found: warn

name: Results R3 Seven Proven Identity Source Recovery
on:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r3-seven-identity-recovery.yml]
permissions:
  contents: read
concurrency:
  group: results-r3-seven-identities-dev
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R3_CURRENT_STOCK_LIMIT: '262'
      RESULTS_R3_CURRENT_SYMBOLS: 'ARVINDFASN,ASHOKA,AURIONPRO,AVANTIFEED,DDEVPLSTIK,SANSERA,VMART'
      RESULTS_R3_CURRENT_ACK: 'FOUR_CURRENT_ORIGINAL_XBRL'
      RESULTS_R3_CURRENT_DRY_RUN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Development-only credentials
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
          for key in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY; do test -n "${!key:-}" || exit 1; done
      - run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3==1.40.46' 'psycopg[binary]==3.2.10' 'requests==2.32.5' 'beautifulsoup4==4.13.5'
      - name: Strict XBRL and R4 tests
        run: |
          python -m py_compile scripts/results/r3-current-quarter-integrated-xbrl.py
          python scripts/results/test_r5_legacy_2024_xbrl.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
      - name: Acquire four current quarters from validated issuer originals
        run: |
          mkdir -p tmp/r3-seven
          python scripts/results/r3-current-quarter-integrated-xbrl.py > tmp/r3-seven/current-acquisition.json
          python - <<'PY'
          import json
          x=json.load(open('tmp/r3-seven/current-acquisition.json'))
          print(json.dumps({k:x.get(k) for k in ('checked','qualified','observations_inserted','periods','failures','blocked')},sort_keys=True))
          assert x['blocked'] is None
          PY
      - name: Verify, hash-readback and select only source-qualified quarterly facts
        run: |
          set -euo pipefail
          python scripts/results/r4-verify-quarterly.py --apply
          cp tmp/results-r4/readback.json tmp/r3-seven/current-selection.json
          python - <<'PY'
          import json
          x=json.load(open('tmp/r3-seven/current-selection.json'))
          print(json.dumps({k:x.get(k) for k in ('created_decisions','conflicting_existing_decisions','exceptions')},sort_keys=True))
          assert x['conflicting_existing_decisions']==0
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r3-seven-original-filing-readback
          path: tmp/r3-seven/*.json
          retention-days: 21
          if-no-files-found: warn

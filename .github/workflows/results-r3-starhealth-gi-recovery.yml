name: Results R3 STARHEALTH Official GI Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - PortfolioAI-Development
    paths:
      - scripts/results/r3-live-public-filing-batch.py
      - scripts/results/test_r3_live_public_filing_batch.py
      - scripts/results/r4-verify-quarterly.py
      - .github/workflows/results-r3-starhealth-gi-recovery.yml

permissions:
  contents: read

concurrency:
  group: results-r3-starhealth-gi-development
  cancel-in-progress: false

jobs:
  recover-insurer:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      RESULTS_MAX_STOCKS: "262"
      RESULTS_TARGET_SYMBOLS: "STARHEALTH"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Confirm Development-only isolation and required secrets
        shell: bash
        run: |
          set -euo pipefail
          for var in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_R2_BUCKET; do
            [[ -n "${!var:-}" ]] || { echo "MISSING_CONFIGURATION:$var"; exit 1; }
          done
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || { echo NOT_DEVELOPMENT_DB; exit 1; }
          [[ "$CLOUDFLARE_R2_BUCKET" == "portfolioai-history-dev" ]] || { echo NOT_DEVELOPMENT_BUCKET; exit 1; }
      - name: Install pinned original-source and verifier libraries
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'boto3==1.40.46' 'psycopg[binary]==3.2.10' 'requests==2.32.5' 'beautifulsoup4==4.13.5'
      - name: Test genuine GI source parser, premium net, PAT, diluted EPS
        run: python scripts/results/test_r3_live_public_filing_batch.py -v
      - name: Try official NSE GI filing discovery and immutable original sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/results-r3
          python scripts/results/r3-live-public-filing-batch.py > tmp/results-r3/starhealth-source.json
          python -m json.tool tmp/results-r3/starhealth-source.json > /dev/null
      - name: Verify source versions and safely select qualified insurer facts
        if: ${{ !cancelled() }}
        run: python scripts/results/r4-verify-quarterly.py --apply
      - name: Independently check all 262 equities without changing accepted decisions
        if: always()
        shell: bash
        run: |
          mkdir -p tmp/results-r3
          python scripts/results/r3-current-coverage-readback.py > tmp/results-r3/coverage-after-insurer.json
          python - <<'PY'
          import json
          r=json.load(open("tmp/results-r3/coverage-after-insurer.json"))
          print({k:r[k] for k in ("equities","complete_equities","incomplete_equities","result")})
          PY
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r3-development-starhealth-gi
          path: |
            tmp/results-r3/starhealth-source.json
            tmp/results-r3/coverage-after-insurer.json
          if-no-files-found: warn
          retention-days: 15

name: Results R3 Development Remaining Non-Insurer Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - PortfolioAI-Development
    paths:
      - scripts/results/r3-live-public-filing-batch.py
      - scripts/results/test_r3_live_public_filing_batch.py
      - scripts/results/r4-verify-quarterly.py
      - .github/workflows/results-r3-targeted-remaining-12.yml

permissions:
  contents: read

concurrency:
  group: results-r3-original-filings-development
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      RESULTS_MAX_STOCKS: "262"
      RESULTS_TARGET_SYMBOLS: "360ONE,BDL,COROMANDEL,DATAPATTNS,ICICIAMC,JIOFIN,MGL,WELSPUNLIV,YATRA,ZAGGLE,AVANTIFEED,VAML"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fail closed unless configured for Development
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_R2_BUCKET; do
            [[ -n "${!name:-}" ]] || { echo "MISSING_CONFIGURATION:$name"; exit 1; }
          done
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || { echo NOT_DEVELOPMENT_DB; exit 1; }
          [[ "$CLOUDFLARE_R2_BUCKET" == "portfolioai-history-dev" ]] || { echo NOT_DEVELOPMENT_BUCKET; exit 1; }
      - name: Install pinned official-source dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'boto3==1.40.46' 'psycopg[binary]==3.2.10' 'requests==2.32.5' 'beautifulsoup4==4.13.5'
      - name: Run original-source parser and identity regression tests
        run: python scripts/results/test_r3_live_public_filing_batch.py -v
      - name: Acquire missing official NSE 2025-26 quarterly originals with bounded paging
        shell: bash
        run: |
          mkdir -p tmp/results-r3
          python scripts/results/r3-live-public-filing-batch.py > tmp/results-r3/remaining-12-acquisition.json
          python -m json.tool tmp/results-r3/remaining-12-acquisition.json > /dev/null
      - name: Run Development R2 original evidence qualification and protected source selection
        if: ${{ !cancelled() }}
        run: python scripts/results/r4-verify-quarterly.py --apply
      - name: Read back all 262 equities (including closed positions, not ETFs)
        if: always()
        shell: bash
        run: |
          mkdir -p tmp/results-r3
          python scripts/results/r3-current-coverage-readback.py > tmp/results-r3/remaining-12-coverage.json
          python - <<'PY'
          import json
          r=json.load(open("tmp/results-r3/remaining-12-coverage.json"))
          print({k:r[k] for k in ("equities","etfs_excluded","complete_equities","incomplete_equities","result")})
          PY
      - name: Record source and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r3-development-remaining-12
          path: |
            tmp/results-r3/remaining-12-acquisition.json
            tmp/results-r3/remaining-12-coverage.json
            tmp/results-r4/readback.json
          if-no-files-found: warn
          retention-days: 15

name: Results R4 Development 2024 Proven Identity Recovery
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r4-2024-historical-gap-recovery.yml
      - scripts/results/r5-legacy-2024-xbrl.py
      - scripts/results/test_r5_legacy_2024_xbrl.py
      - scripts/results/r4-verify-quarterly.py
permissions:
  contents: read
concurrency:
  group: results-r4-2024-historical-source-dev
  cancel-in-progress: false
jobs:
  acquire-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R5_LEGACY_STOCK_LIMIT: "262"
      RESULTS_R5_LEGACY_ACK: "2024_SEP_DEC_ORIGINAL_XBRL"
      RESULTS_R5_LEGACY_SYMBOLS: AXISBANK
      RESULTS_R5_LEGACY_DRY_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Development-only credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
          for name in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY; do test -n "${!name:-}" || exit 1; done
      - name: Install pinned source dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'beautifulsoup4==4.13.5'
      - name: Verify source parsing and R4 regression tests
        run: |
          python scripts/results/test_r5_legacy_2024_xbrl.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
          python scripts/results/test_r4_eight_quarter_readback.py -v
      - name: Reuse historical selected facts and acquire only missing NSE originals
        shell: bash
        run: |
          mkdir -p tmp/results-r4
          python scripts/results/r5-legacy-2024-xbrl.py > tmp/results-r4/2024-historical-recovery.json
          python - <<'PY'
          import json
          x=json.load(open('tmp/results-r4/2024-historical-recovery.json'))
          print(json.dumps({k:x.get(k) for k in ('checked','qualified','observations_inserted','periods','failures','blocked')},sort_keys=True))
          if x.get("blocked"):
              raise SystemExit('ORIGINAL_SOURCE_ACCESS_BLOCKED')
          PY
      - name: Original-source validation and protected selection across all eight quarters
        env:
          RESULTS_R4_EIGHT_QUARTER_SELECTION: "1"
        shell: bash
        run: python scripts/results/r4-verify-quarterly.py --apply
      - name: Independent 262x8 source acceptance and gap readback
        if: always()
        shell: bash
        run: |
          mkdir -p tmp/results-r4
          python scripts/results/r4-eight-quarter-readback.py > tmp/results-r4/2024-after-recovery.json
          python - <<'PY'
          import json
          x=json.load(open('tmp/results-r4/2024-after-recovery.json'))
          print(json.dumps({k:x[k] for k in ('equities','total_slots','displayed_four_quarter_complete_equities','status_counts','status')},sort_keys=True))
          PY
      - name: Retain original-source and exceptions report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r4-2024-historical-gap-development
          path: |
            tmp/results-r4/2024-historical-recovery.json
            tmp/results-r4/readback.json
            tmp/results-r4/eight-quarter-readback.json
          retention-days: 21
          if-no-files-found: warn

name: R4 BSE BEL December Original PDF Layout
on:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-bel-dec-original-probe.yml]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install original PDF reader
        run: python -m pip install --disable-pip-version-check 'requests==2.32.5' 'pymupdf==1.26.6'
      - name: Verify frozen original BEL financial announcement and preserve layout
        run: |
          mkdir -p tmp/results-r4
          python - <<'PY'
          import requests,hashlib,fitz
          u='https://www.bseindia.com/xml-data/corpfiling/AttachHis/119a097d-eaa1-4c26-82c4-6fe22c064c96.pdf'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.bseindia.com/'})
          r=s.get(u,timeout=40)
          r.raise_for_status()
          b=r.content
          assert b.startswith(b'%PDF') and hashlib.sha256(b).hexdigest()=='38065e01963687c9df8dee365ad7e16d51604674dab5100b96ed7b83e667213b'
          open('tmp/results-r4/BEL-2024-12-original.pdf','wb').write(b)
          doc=fitz.open(stream=b,filetype='pdf')
          for idx,p in enumerate(doc):
              t=p.get_text('text',sort=True)
              if idx<=2 or ('Revenue from operations' in t and ('Consolidated' in t or 'CONSOLIDATED' in t)):
                  print('BEL_DEC_ORIGINAL',idx+1,repr(t[:7500]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: results-r4-bel-dec-official-pdf
          path: tmp/results-r4/BEL-2024-12-original.pdf
          if-no-files-found: error
          retention-days: 3

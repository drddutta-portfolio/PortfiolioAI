name: Results R4 Full Backlog Signed Statement Recovery
on:
  workflow_dispatch:
  workflow_call:
permissions: {contents: read}
concurrency:
  group: results-r4-bse-dated-quarter-review-development
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned evidence dependencies
        run: |
          python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'beautifulsoup4==4.13.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Verify exact dated-column extraction including the real HTML adapter
        run: |
          python scripts/results/test_r4_pdf_geometry.py -v
          python scripts/results/test_r4_bse_historical_batch.py -v
          python scripts/results/test_r4_issuer_name.py -v
          python scripts/results/test_r4_private_inventory.py -v
          python scripts/results/test_portfolio_bse.py -v
      - name: Review every assigned missing quarter from full original PDFs without financial promotion
        run: python scripts/results/r4-bse-dated-quarter-review.py --shard ${{ matrix.shard }}
      # Compact issuer financial evidence stays private in Development R2/DB.
      # Original NSE HTML is not retained; no public financial artifact uploads.

# Recheck every slot using actual quarter-group headings rather than financial-page titles.
  qualify:
    needs: review
    if: always() && github.ref == 'refs/heads/PortfolioAI-Development'
    uses: ./.github/workflows/results-r4-dated-pdf-replay.yml
    secrets: inherit

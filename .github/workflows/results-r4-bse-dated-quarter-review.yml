name: Results R4 Full Backlog Signed Statement Recovery
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-bse-dated-quarter-review.yml]
permissions: {contents: read}
concurrency:
  group: results-r4-bse-dated-quarter-review-development
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned evidence dependencies
        run: |
          python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'beautifulsoup4==4.13.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Verify exact dated-column extraction including the real HTML adapter
        run: |
          python scripts/results/test_r4_pdf_geometry.py -v
          python scripts/results/test_r4_bse_historical_batch.py -v
          python scripts/results/test_r4_issuer_name.py -v
          python scripts/results/test_r4_private_inventory.py -v
          python scripts/results/test_portfolio_bse.py -v
      - name: Review every assigned missing quarter from full original PDFs without financial promotion
        run: python scripts/results/r4-bse-dated-quarter-review.py --shard ${{ matrix.shard }}
      # Compact issuer financial evidence stays private in Development R2/DB.
      # Original NSE HTML is not retained; no public financial artifact uploads.

# Recheck every slot using actual quarter-group headings rather than financial-page titles.
  qualify:
    needs: review
    if: success() && github.ref == 'refs/heads/PortfolioAI-Development'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R4_DATED_PDF_ACK: EXPLICIT_QUARTER_ORIGINAL_REPLAY
      RESULTS_R4_EIGHT_QUARTER_SELECTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned original-source verifier
        run: |
          python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Verify original replay and protected selection contracts
        run: |
          python scripts/results/test_r4_bse_dated_proof.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
      - name: Process the entire remaining backlog from the refreshed source inventory
        run: python scripts/results/r4-bse-dated-quarter-promote.py
      - name: Independent original-file replay and full-cohort protected selection
        run: python scripts/results/r4-verify-quarterly.py --apply
      - name: Full source-qualified eight-quarter readback
        if: always()
        run: |
          mkdir -p tmp/results-r4
          python scripts/results/r4-eight-quarter-readback.py > tmp/results-r4/full-backlog-readback.json
          python - <<'PY'
          import json
          a=json.load(open('tmp/results-r4/full-backlog-readback.json'))
          print(json.dumps({k:a[k] for k in ('equities','total_slots','status_counts','status')},sort_keys=True))
          PY
      # No public financial artifacts; evidence and diagnostics stay private.
# Recollect up to eight primary statement attachments per publication window using full catalog headlines.

# Revisit fresh provider citations and delayed comparative filings across the full backlog.

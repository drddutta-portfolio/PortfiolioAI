name: Results R4 Development BSE Original Source Recovery
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-bse-original-batch.yml]
permissions:
  contents: read
concurrency:
  group: results-r4-bse-original-batch-development
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R4_USE_FRESH_TRENDLYNE_LINKS: '1'
      RESULTS_R4_FORCE_FRESH: ${{ github.event_name == 'push' && '1' || '0' }}
      RESULTS_R4_BSE_BATCH_ACK: 2024_2025_BSE_ORIGINAL_EVIDENCE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify exact Development isolation
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
          test -n "$CLOUDFLARE_R2_ACCESS_KEY_ID"
          test -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          test -n "$CLOUDFLARE_R2_ACCOUNT_ID"
      - name: Install pinned original-filing dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2'
      - name: Verify code and deterministic regression suites
        run: |
          python -m py_compile scripts/results/r4-bse-historical-batch.py scripts/results/r4-verify-quarterly.py scripts/results/r4-eight-quarter-readback.py
          python scripts/results/test_r4_bse_historical_batch.py -v
          python scripts/results/test_r4_nse_failure_isolation.py -v
          python scripts/results/test_r4_krn_correction.py -v
          python scripts/results/test_portfolio_bse.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
          python scripts/results/test_r4_eight_quarter_readback.py -v
      - name: Acquire verified issuer originals for historical gaps
        run: |
          mkdir -p tmp/results-r4
          python scripts/results/r4-bse-historical-batch.py --apply --shard-count 4 --shard-index ${{ matrix.shard }} --max-companies 80 --max-pdfs-per-quarter 15 --output tmp/results-r4/bse-original-shard-${{ matrix.shard }}.json
  verify:
    needs: recover
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R4_EIGHT_QUARTER_SELECTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify Development-only target
        run: |
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
      - name: Install pinned verifier
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'pymupdf==1.26.6'
      - name: Independent R2 source integrity and protected selections
        run: |
          mkdir -p tmp/results-r4
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts/results')
          import importlib.util
          spec=importlib.util.spec_from_file_location('batch','scripts/results/r4-bse-historical-batch.py')
          batch=importlib.util.module_from_spec(spec);spec.loader.exec_module(batch)
          from r4_krn_correction import retain_notice
          try:
              retain_notice(batch,batch.r2_client())
              print('KRN_ORIGINAL_CORRECTION_NOTICE_RETAINED')
          except Exception as error:
              print('KRN_CORRECTION_NOTICE_NOT_QUALIFIED',type(error).__name__)
          PY
          python scripts/results/r4-verify-quarterly.py --apply
      - name: Exact 262 x eight-quarter readback
        if: always()
        run: |
          mkdir -p tmp/results-r4
          python scripts/results/r4-eight-quarter-readback.py > tmp/results-r4/bse-after-readback.json
          python - <<'PY'
          import json
          a=json.load(open('tmp/results-r4/bse-after-readback.json'))
          print(json.dumps({k:a[k] for k in ('equities','total_slots','status_counts','status')},sort_keys=True))
          PY
      # Originals, per-company traces and readbacks stay in private Development storage.

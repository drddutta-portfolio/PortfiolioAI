name: Results R4 Development BseIndiaApi 2024 Original-Filing Discovery
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-bseindiaapi-historical-discovery.yml]
permissions:
  contents: read
concurrency:
  group: results-r4-bseindiaapi-discovery-dev
  cancel-in-progress: false
jobs:
  bse-2024-original-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Development-only source configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
      - name: Install pinned BSE vendor adapter dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'psycopg[binary]==3.2.10' 'requests==2.32.5' 'mthrottle==0.0.2'
      - name: Run BseIndiaApi source integrity regression
        run: python scripts/results/test_portfolio_bse.py -v
      - name: Find official BSE financial-result attachments for verified historical gaps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/results-r4
          python scripts/results/r3-bse-2024-gap-source-index.py \
            --symbols 'AXISBANK,AUROPHARMA,BEL,CANBK,DRREDDY,FEDERALBNK,GRASIM,HAL,ICICIBANK,ONGC,SBIN,TITAN,AVANTIFEED,CAMS,CHOLAFIN,HUDCO,IREDA,BDL,CEMPRO,CGCL,COFORGE,TDPOWERSYS,SHRIRAMFIN,STARHEALTH' \
            --limit 24 --max-pages 2 --output tmp/results-r4/bseindiaapi-2024-discovery.json
          python - <<'PY'
          import json
          r=json.load(open('tmp/results-r4/bseindiaapi-2024-discovery.json'))
          a=r['targets']
          print(json.dumps({'targets':len(a),
             'announcements':sum(sum(s.get('number_of_candidates',0) for s in x.get('sources',[])) for x in a),
             'source_errors':sum(x.get('status')=='BSE_LOOKUP_UNAVAILABLE' for x in a),
             'exact_isin_matched':sum(x.get('status')=='BSE_INDEX_ATTEMPTED' for x in a),
             'qualified_financial_quarters':0,
             'source_index_only':True},sort_keys=True))
          PY
      - name: Retain indexed BSE official issuer originals for qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r4-bseindiaapi-2024-discovery-only
          path: tmp/results-r4/bseindiaapi-2024-discovery.json
          if-no-files-found: warn
          retention-days: 21

name: Results R4 Full Backlog Dated OCR Recovery
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-dated-ocr-backlog.yml]
permissions: {contents: read}
concurrency:
  group: results-r4-dated-ocr-backlog-development
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  recover:
    if: github.ref == 'refs/heads/PortfolioAI-Development'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {shard: [0, 1, 2, 3, 4, 5, 6, 7]}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R4_DATED_PDF_ACK: EXPLICIT_QUARTER_ORIGINAL_REPLAY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned source and OCR dependencies
        run: |
          python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Real scanned-document and independent financial proof regressions
        run: |
          python scripts/results/test_r4_ocr_dated_geometry.py -v
          python scripts/results/test_r4_bse_dated_proof.py -v
          python scripts/results/test_r4_pdf_geometry.py -v
          python scripts/results/test_r4_recovery_queue.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
      - name: Batch every target quarter per original page and preserve every failed attempt
        run: python scripts/results/r4-ocr-dated-backlog.py --shard ${{ matrix.shard }}
  verify:
    needs: recover
    if: always() && github.ref == 'refs/heads/PortfolioAI-Development'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R4_EIGHT_QUARTER_SELECTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned independent source replay dependencies
        run: |
          python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'pymupdf==1.26.6'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Reopen originals and independently repeat full-document and double financial OCR
        run: python scripts/results/r4-verify-quarterly.py --apply
      - name: Exact complete-cohort readback
        if: always()
        run: |
          mkdir -p tmp/results-r4
          python scripts/results/r4-eight-quarter-readback.py > tmp/results-r4/dated-ocr-readback.json
          python - <<'PY'
          import json
          a=json.load(open('tmp/results-r4/dated-ocr-readback.json'))
          print(json.dumps({k:a[k] for k in ('equities','total_slots','status_counts','status')},sort_keys=True))
          PY
      # All originals, OCR text, financial proofs and rejection diagnostics remain private.

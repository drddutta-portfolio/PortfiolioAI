name: Results R4 Full Backlog Original PDF Replay
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-dated-pdf-replay.yml]
permissions: {contents: read}
concurrency:
  group: results-r4-dated-pdf-replay-development
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/PortfolioAI-Development'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R4_DATED_PDF_ACK: EXPLICIT_QUARTER_ORIGINAL_REPLAY
      RESULTS_R4_EIGHT_QUARTER_SELECTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned original-source dependencies
        run: python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2'
      - name: Verify source replay and existing selection protections
        run: |
          python scripts/results/test_r4_pdf_geometry.py -v
          python scripts/results/test_r4_bse_dated_proof.py -v
          python scripts/results/test_r4_bse_historical_batch.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
          python scripts/results/test_r4_eight_quarter_readback.py -v
          python -m py_compile scripts/results/r4-bse-dated-quarter-promote.py scripts/results/r4-verify-quarterly.py
      - name: Attempt every unresolved historical quarter independently
        run: python scripts/results/r4-bse-dated-quarter-promote.py
      - name: Independently reopen original PDFs and preserve accepted selections
        if: success()
        run: python scripts/results/r4-verify-quarterly.py --apply
      - name: Full eight-quarter readback
        if: always()
        run: |
          mkdir -p tmp/results-r4
          python scripts/results/r4-eight-quarter-readback.py > tmp/results-r4/dated-pdf-readback.json
          python - <<'PY'
          import json
          a=json.load(open('tmp/results-r4/dated-pdf-readback.json'))
          print(json.dumps({k:a[k] for k in ('equities','total_slots','status_counts','status')},sort_keys=True))
          PY
      # Financial rows, originals and rejection traces stay in private Development storage.

name: Results R4 Development Eight-Quarter Source Qualification
on:
  workflow_dispatch:
  push:
    branches:
      - PortfolioAI-Development
    paths:
      - .github/workflows/results-r4-eight-quarter-qualification.yml
      - scripts/results/r4-eight-quarter-readback.py
      - scripts/results/test_r4_eight_quarter_readback.py
      - scripts/results/r4-verify-quarterly.py
      - scripts/results/r4_official_issuer.py
      - scripts/results/test_r4_official_issuer.py
      - scripts/results/r4_shared_original.py
      - scripts/results/r4_bdl_correction.py
      - scripts/results/test_r4_bdl_correction.py
      - scripts/results/r4_pdf_geometry.py
      - scripts/results/r4-bse-dated-quarter-promote.py

permissions:
  contents: read

concurrency:
  group: results-r4-eight-quarter-development
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  qualify-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Development database and R2 isolation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo MISSING_DEV_DATABASE_SECRET; exit 1; }
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || { echo WRONG_DATABASE; exit 1; }
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || { echo WRONG_R2_BUCKET; exit 1; }
          test -n "$CLOUDFLARE_R2_ACCOUNT_ID"
          test -n "$CLOUDFLARE_R2_ACCESS_KEY_ID"
          test -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
      - name: Install pinned verifier and readback dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'pymupdf==1.26.6' 'requests==2.32.5' 'mthrottle==0.0.2'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Run source qualification and eight-quarter readback regression tests
        run: |
          python -m unittest discover -s scripts/results -p test_r4_official_issuer.py -v
          python -m unittest discover -s scripts/results -p test_r4_bdl_correction.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
          python scripts/results/test_r4_eight_quarter_readback.py -v
          python -m unittest discover -s scripts/results -p test_r4_pdf_geometry.py -v
          python -m unittest discover -s scripts/results -p test_r4_shared_original.py -v
      - name: Verify immutable Development R2 source evidence across eight quarters
        env:
          RESULTS_R4_EIGHT_QUARTER_SELECTION: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/results-r4
          python scripts/results/r4-verify-quarterly.py --apply | tee tmp/results-r4/eight-quarter-source-verification.log
      - name: Independently reconcile 262 equities across eight quarters
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/results-r4
          python scripts/results/r4-eight-quarter-readback.py > tmp/results-r4/eight-quarter-report-stdout.json
          python - <<'PY'
          import json
          with open("tmp/results-r4/eight-quarter-readback.json") as f:
              a=json.load(f)
          summary={k:a[k] for k in ("contract","equities","total_slots",
              "displayed_four_quarter_complete_equities",
              "potential_yoy_pairs_not_final_comparability","status_counts","status")}
          print(json.dumps(summary,sort_keys=True))
          PY
      # Financial readbacks and source traces stay in private Development storage.
      # Acquisition runs in the four-worker replay workflow; this job only independently qualifies sources.

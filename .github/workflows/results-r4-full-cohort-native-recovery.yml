name: Results R4 Full Historical Cohort Native Original Recovery
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-full-cohort-native-recovery.yml]
permissions: {contents: read}
jobs:
  recover:
    if: github.ref == 'refs/heads/PortfolioAI-Development'
    uses: ./.github/workflows/results-r4-official-issuer-recovery.yml
    with:
      native_only: true
      # Complete unresolved issuer cohort at the 6 November recovery checkpoint.
      # The shared collector still queries canonical missing quarters; selected
      # quarters are skipped and original audit/independent selection stay mandatory.
      target_symbols: BLUSPRING,COFORGE,CPPLUS,DDEVPLSTIK,GROWW,ICICIAMC,IKS,LENSKART,LGEINDIA,PINELABS,STARHEALTH,TATACAP,TMCV,UTLSOLAR,VAML
    secrets: inherit

name: Results R4 Development Historical Gap Recovery V3
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r4-historical-recovery-v3.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: results-r4-historical-recovery-v3-development
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R4_BSE_BATCH_ACK: 2024_2025_BSE_ORIGINAL_EVIDENCE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify exact Development isolation
        run: |
          set -euo pipefail
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
          test -n "$CLOUDFLARE_R2_ACCESS_KEY_ID"
          test -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          test -n "$CLOUDFLARE_R2_ACCOUNT_ID"
      - name: Install pinned original-filing dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Verify code and deterministic regression suites
        run: |
          python -m py_compile scripts/results/r4-bse-historical-batch.py scripts/results/r4-verify-quarterly.py scripts/results/r4-eight-quarter-readback.py
          python scripts/results/test_r4_pdf_geometry.py -v
          python scripts/results/test_r4_bse_historical_batch.py -v
          python scripts/results/test_portfolio_bse.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
          python scripts/results/test_r4_eight_quarter_readback.py -v
      - name: Acquire verified issuer originals for historical gaps
        run: |
          mkdir -p tmp/results-r4
          python scripts/results/r4-bse-historical-batch.py --apply --shard-count 8 --shard-index ${{ matrix.shard }} --max-companies 80 --max-pdfs-per-quarter 50 --output tmp/results-r4/bse-original-shard-${{ matrix.shard }}.json
      - name: Retain per-company originals and rejection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-bse-original-shard-${{ matrix.shard }}
          path: tmp/results-r4/bse-original-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 21
  verify:
    needs: recover
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R4_EIGHT_QUARTER_SELECTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify Development-only target
        run: |
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
      - name: Install pinned verifier
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'pymupdf==1.26.6'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Independent R2 source integrity and protected selections
        run: |
          mkdir -p tmp/results-r4
          python scripts/results/r4-verify-quarterly.py --apply
      - name: Exact 262 x eight-quarter readback
        if: always()
        run: |
          mkdir -p tmp/results-r4
          python scripts/results/r4-eight-quarter-readback.py > tmp/results-r4/bse-after-readback.json
          python - <<'PY'
          import json
          a=json.load(open('tmp/results-r4/bse-after-readback.json'))
          print(json.dumps({k:a[k] for k in ('equities','total_slots','status_counts','status')},sort_keys=True))
          PY
      - name: Regrade R5 from recovered Development originals (no provider calls)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          readback=json.load(open("tmp/results-r4/readback.json"))
          assert readback["mode"]=="APPLY"
          assert readback["conflicting_existing_decisions"]==0
          assert os.environ["GITHUB_REF"]=="refs/heads/PortfolioAI-Development"
          repo="drddutta-portfolio/PortfiolioAI"
          for workflow in ("results-r5-original-scope-proof.yml","results-r5-g-live-census.yml"):
              url="https://api.github.com/repos/"+repo+"/actions/workflows/"+workflow+"/dispatches"
              request=urllib.request.Request(url,
                  data=json.dumps({"ref":"PortfolioAI-Development"}).encode(),
                  headers={"Accept":"application/vnd.github+json",
                           "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                           "X-GitHub-Api-Version":"2022-11-28",
                           "Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(request,timeout=30) as response:
                  assert response.status==204
              print("R5_REASSESS_DISPATCHED",workflow,"Development only")
          PY
      - name: Retain acceptance and exceptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-bse-independent-readback
          path: |
            tmp/results-r4/readback.json
            tmp/results-r4/eight-quarter-readback.json
            tmp/results-r4/bse-after-readback.json
          if-no-files-found: warn
          retention-days: 21

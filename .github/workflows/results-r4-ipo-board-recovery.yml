name: Results R4 Audited IPO Restated Board Scope Recovery
# Raw current XML anchors resolve through the bounded dependency-free catalog.
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-ipo-board-recovery.yml]
permissions: {contents: read}
concurrency:
  group: results-r4-ipo-board-recovery-development
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/PortfolioAI-Development'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
      RESULTS_R4_EIGHT_QUARTER_SELECTION: '1'
      RESULTS_R4_RESTATED_DISPLAY_READY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned original replay dependencies
        run: |
          python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Verify explicit correction and protected selection regressions
        run: |
          python scripts/results/test_r4_ipo_board_pdf.py -v
          python scripts/results/test_r4_scope_catalog.py -v
          python scripts/results/test_r4_nse_catalog_revision.py -v
          python scripts/results/test_r4_avanti_correction.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
      - name: Attempt every missing historical quarter against retained signed PDF originals
        id: collect
        run: python scripts/results/r4-ipo-board-recovery.py
      - name: Independently qualify all sources and preserve protected selections
        if: ${{ always() && steps.collect.outcome != 'skipped' && steps.collect.outcome != '' }}
        run: |
          python scripts/results/r4-verify-quarterly.py --apply
          python scripts/results/r4-eight-quarter-readback.py
# No source evidence or financial diagnostics are uploaded to public artifacts.

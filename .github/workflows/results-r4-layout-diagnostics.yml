name: Results R4 Private Original Layout Diagnostics
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-layout-diagnostics.yml]
permissions: {contents: read}
concurrency:
  group: results-r4-layout-diagnostics-development
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/PortfolioAI-Development'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned retained-original inspection dependencies
        run: python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2'
      - name: Verify layout metadata excludes financial amounts
        run: python -m unittest discover -s scripts/results -p test_r4_layout_diagnostics.py -v
      - name: Inspect bounded retained layouts without financial promotion
        run: python scripts/results/r4-layout-diagnostics.py --issuer-seeds
      # No original, image, provider response or financial trace is uploaded as an artifact.

# Inspect approved issuer originals across the full unresolved cohort; no financial promotion.
# Verify corresponding three-month headings and separate quarter/YTD groups using physical columns.

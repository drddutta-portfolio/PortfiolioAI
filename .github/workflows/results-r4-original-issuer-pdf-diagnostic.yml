name: R4 Development original issuer PDF evidence diagnostic
on:
  push:
    branches: [results-r4-original-issuer-pdf-20261015]
    paths: [.github/workflows/results-r4-original-issuer-pdf-diagnostic.yml]
permissions:
  contents: read
jobs:
  pdf-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'pymupdf==1.26.6' 'requests==2.32.5'
      - name: Diagnostic for official issuer-filed PDF quarterly tables (read only)
        run: |
          python - <<'PY'
          import requests,fitz,hashlib,json
          urls={
          'COFORGE':'https://www.coforge.com/hubfs/Outcome-of-Board-Meeting-Q3-FY2026.pdf',
          'HBLENGINE':'https://www.hbl.in/reports/results_sep2025.pdf',
          'SHAILY':'https://static.shaily.com/DxtZAIZETTqWYz8HWGns-q-2-f-y-26-i-nvestor-presentation-submitted-pdf'}
          for symbol,url in urls.items():
              try:
                  r=requests.get(url,timeout=24,headers={'User-Agent':'Mozilla/5.0'})
                  r.raise_for_status()
                  b=r.content
                  if not b.startswith(b'%PDF'):raise ValueError('NOT_ORIGINAL_PDF')
                  doc=fitz.open(stream=b,filetype='pdf')
                  pages=[]
                  for i,p in enumerate(doc):
                      text=p.get_text('text')
                      if any(t in text.lower() for t in ('consolidated financial results','quarter ending','25,665','rs. in mn','diluted','1222.90','1,222.90','256.7')):
                          pages.append({'page':i,'text':text[:3400]})
                  print('R4_ISSUER_PDF_DIAGNOSTIC',json.dumps({'symbol':symbol,'url':url,'sha256':hashlib.sha256(b).hexdigest(),
                    'bytes':len(b),'pages':len(doc),'relevant_pages':pages[:5]},ensure_ascii=True))
              except Exception as e:
                  print('R4_ISSUER_PDF_DIAGNOSTIC',json.dumps({'symbol':symbol,'error':type(e).__name__,'message':str(e)[:140]}))
          PY

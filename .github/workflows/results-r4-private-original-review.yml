name: Results R4 Private Original Page Review
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-private-original-review.yml]
permissions: {contents: read}
concurrency:
  group: results-r4-private-original-review-development
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  inspect:
    if: github.ref == 'refs/heads/PortfolioAI-Development'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {shard: [0, 1, 2, 3]}
    env:
      RESULTS_R4_REVIEW_SHARED_ONLY: "1"
      RESULTS_R4_REVIEW_SHARD: ${{ matrix.shard }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install existing pinned private-source dependencies
        run: |
          python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Prepare every remaining issuer original for private page review
        run: python scripts/results/r4-private-original-review.py
      # Original bytes and the review index remain private in Development R2.
      # No original, image, financial trace or encoded payload is logged or uploaded as a public artifact.

# Review all remaining issuers in four independent shards; private originals and coordinates only.

# Include private original-page previews for visual confirmation of source extraction defects.

# Refresh the private review corpus with newly retained signed issuer originals.

# Retain bounded failed render coordinates privately for targeted parser repair.

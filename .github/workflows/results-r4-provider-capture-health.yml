name: Results R4 Retained Provider Capture Health
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-provider-capture-health.yml]
permissions: {contents: read}
concurrency:
  group: results-r4-provider-capture-health-development
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/PortfolioAI-Development'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned read-only audit dependencies
        run: python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46'
      - name: Verify health classification regressions
        run: python -m unittest discover -s scripts/results -p test_r4_provider_capture_health.py -v
      - name: Inspect retained response envelopes without logging source content
        run: python scripts/results/r4-provider-capture-health.py

# Accept the established Development credential's full endpoint URL or exact account ID.

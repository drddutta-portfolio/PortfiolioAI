name: Results R4 Aggregate Catalog Schema Diagnostics
on:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-remaining-diagnostics.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R4_PUBLIC_RENAME_ONLY: "1"
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'beautifulsoup4==4.13.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2'
      - name: Inspect schema and aggregate checks without financial or issuer payloads
        run: python scripts/results/r4-remaining-source-diagnostics.py

# Aggregate context categories only: no context identifiers, issuer details or amounts are exported.

# Compare anonymous identity/date categories for remaining context failures.

name: Results R4 Independent Retry Validation
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-retry-validation.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/PortfolioAI-Development'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install locked application dependencies
        run: npm ci
      - name: Architecture boundaries
        run: npm run check:architecture
      - name: TypeScript
        if: always()
        run: npm run typecheck
      - name: Application lint
        if: always()
        run: npm run lint
      - name: Edge function lint
        if: always()
        run: npm run lint:edge
      - name: Production build
        if: always()
        run: npm run build
      - name: Install pinned source dependencies
        run: |
          python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2' 'beautifulsoup4==4.13.5'
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Independent item and scheduled authentication regressions
        run: |
          python scripts/results/test_r4_recovery_queue.py -v
          python scripts/results/test_r4_nse_failure_isolation.py -v
          python scripts/results/test_r4_nse_issuer_bridge.py -v
          python scripts/results/test_r4_issuer_rename.py -v
          python scripts/results/test_r4_krn_correction.py -v
          python scripts/results/test_r4_pdf_geometry.py -v
          python scripts/results/test_r4_bse_dated_proof.py -v
          python scripts/results/test_r4_ocr_dated_geometry.py -v
          python scripts/results/test_r4_issuer_name.py -v
          python scripts/results/test_r4_private_inventory.py -v
          python scripts/results/test_r4_dated_columns.py -v
          python scripts/results/test_r4_scope_bridge.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
          python scripts/results/test_r5_legacy_2024_xbrl.py -v
          node scripts/results/test_r4_workflow_identity.mjs
          python -m py_compile scripts/results/r4-recovery-monitor.py scripts/results/r4-nse-lineage-batch.py scripts/results/r4-bse-historical-batch.py scripts/results/r4-ocr-retained-batch.py scripts/results/r4-trendlyne-history.py
      - name: Whitespace integrity
        run: git diff HEAD^ HEAD --check

name: Results R4 Trendlyne Historical Contract Recovery
on:
  push:
    branches: [PortfolioAI-Development]
    paths: [.github/workflows/results-r4-trendlyne-history.yml]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: results-r4-trendlyne-historical-development
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pinned historical source dependencies
        run: python -m pip install 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'requests==2.32.5' 'pymupdf==1.26.6' 'mthrottle==0.0.2'
      - name: Fresh authenticated tool discovery and exact historical values request
        run: python scripts/results/r4-trendlyne-history.py
      - name: Read completed first BSE shard diagnostics
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: r4-bse-original-shard-1
          run-id: 38945402717
          github-token: ${{ github.token }}
          path: tmp/results-r4/bse-prior
      - name: Report actual BSE rejection stages
        if: always()
        run: |
          python - <<'PY'
          import json,glob,collections
          for filename in glob.glob('tmp/results-r4/bse-prior/*.json'):
              report=json.load(open(filename))
              print('R4_BSE_REJECTIONS',json.dumps(report))
          PY
      - name: Retain provider contract and raw response readbacks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-trendlyne-historical-contract
          path: tmp/results-r4/trendlyne/
          retention-days: 7

name: Results R5 2025 Original Archive Route Discovery
on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r5-2025-source-discovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'requests==2.32.5'
      - name: Read-only NSE March and June 2025 old-format discovery
        run: |
          python - <<'PY'
          from urllib.parse import urlencode,urlparse
          import requests,json,re
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (compatible; PortfolioAIResearch/1.0)","Accept-Language":"en-IN,en;q=0.8"})
          u="https://www.nseindia.com/companies-listing/corporate-filings-financial-results"
          r=s.get(u,timeout=20)
          if r.status_code in (401,403,429):raise SystemExit("ACCESS_DENIED_"+str(r.status_code))
          r.raise_for_status()
          result=[]
          for symbol in ("RELIANCE","INFY","ICICIBANK"):
            q={"index":"equities","symbol":symbol,"period":"Quarterly","from_date":"01-01-2025","to_date":"01-10-2025"}
            z=s.get("https://www.nseindia.com/api/corporates-financial-results?"+urlencode(q),headers={"Accept":"application/json","Referer":u},timeout=30)
            if z.status_code in (401,403,429):raise SystemExit("ACCESS_DENIED_"+str(z.status_code))
            z.raise_for_status()
            a=z.json()
            if not isinstance(a,list):raise SystemExit("LEGACY_RESPONSE_UNKNOWN")
            selected=[{"end":v.get("toDate"),"start":v.get("fromDate"),"noncumulative":v.get("cumulative"),
              "scope":v.get("consolidated"),"nse_xbrl":bool(re.fullmatch(r"https://nsearchives\.nseindia\.com/corporate/xbrl/[A-Za-z0-9_.-]+\.xml",str(v.get("xbrl") or ""))),
              "catalog_format":v.get("format"),"isin":v.get("isin")} for v in a if v.get("symbol")==symbol and v.get("toDate") in ("31-Mar-2025","30-Jun-2025")]
            result.append({"symbol":symbol,"total":len(a),"targetRecords":selected[:15]})
          print(json.dumps(result,sort_keys=True))
          PY

# Re-run original-format source discovery after the full-cohort legacy extractor returned no March/June originals.

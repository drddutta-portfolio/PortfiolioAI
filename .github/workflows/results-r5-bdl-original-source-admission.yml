name: Results R5 BDL 2025 Signed Comparative Original R2 Proof Replay
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r5-bdl-original-source-admission.yml
      - scripts/results/r5-bdl-original-2025-comparative.py
permissions:
  contents: write
concurrency:
  group: results-r5-bdl-source-proof-development
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard exact GitHub Development branch, project, and private R2 only
        run: |
          test "$GITHUB_REPOSITORY" = "drddutta-portfolio/PortfiolioAI"
          test "$GITHUB_REF" = "refs/heads/PortfolioAI-Development"
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]]
          test "$CLOUDFLARE_R2_BUCKET" = "portfolioai-history-dev"
      - name: Qualify original 2025 Mar standalone issuer-reported comparative, never overwrite R4
        run: |
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'pymupdf==1.26.6' 'requests==2.32.5'
          python scripts/results/r5-bdl-original-2025-comparative.py
          git diff --check
      - name: Pin immutable comparison-only proof IDs only after issuer-original verification
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/features/results/resultsR5BDLOriginalComparisonProof.json; then
            git config user.name "portfolioai-r5-source-proof"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/results/resultsR5BDLOriginalComparisonProof.json
            git commit -m "data(results-r5): pin BDL exact signed 2025 March comparable R5-only issuer original"
            git fetch origin PortfolioAI-Development
            git rebase origin/PortfolioAI-Development
            git push origin HEAD:PortfolioAI-Development
          fi

name: Results R5 CHOLAFIN December 2024 Official Standalone Original Audit
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r5-cholafin-original-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require Development exact issuer original
        run: |
          test "$GITHUB_REPOSITORY" = "drddutta-portfolio/PortfiolioAI"
          test "$GITHUB_REF" = "refs/heads/PortfolioAI-Development"
          python -m pip install --disable-pip-version-check 'pymupdf==1.26.6' 'requests==2.32.5'
          python - <<'PY'
          import fitz,requests,hashlib,json
          from urllib.parse import urlparse
          from pathlib import Path
          u="https://files.cholamandalam.com/Financials_Dec2024_be5d6dd603.pdf"
          r=requests.get(u,timeout=50,headers={"User-Agent":"Mozilla/5.0 (PortfolioAI Results original issuer filing audit)"})
          r.raise_for_status()
          if urlparse(r.url).hostname!="files.cholamandalam.com":raise RuntimeError("EXCHANGE_FILING_HOST_CHANGED")
          b=r.content
          if not b.startswith(b"%PDF"):raise RuntimeError("NOT_AN_EXCHANGE_PDF")
          pdf=fitz.open(stream=b,filetype="pdf")
          if len(pdf)!=15:raise RuntimeError("ORIGINAL_PAGE_COUNT_MISMATCH")
          text=pdf[0].get_text("text").upper()
          for marker in ("CHOLAMANDALAM INVESTMENT AND FINANCE COMPANY","STANDALONE UN-AUDITED FINANCIAL RESULTS","DECEMBER 31, 2024","REVENUE FROM OPERATIONS"):
              if marker not in text:raise RuntimeError("ORIGINAL_PERIOD_SCOPE_NOT_PROVEN:"+marker)
          for marker in ("6,709.21","1,086.53","12.89"):
              if marker not in text:raise RuntimeError("ORIGINAL_COLUMN_FIGURE_NOT_FOUND:"+marker)
          d=hashlib.sha256(b).hexdigest()
          p=Path("tmp/results-r5/cholafin-dec-original");p.mkdir(parents=True,exist_ok=True)
          pdf[0].get_pixmap(matrix=fitz.Matrix(2,2),alpha=False).save(str(p/"CHOLAFIN-Dec2024-standalone.png"))
          evidence={"symbol":"CHOLAFIN","isin":"INE121A01024","quarter":"2024-12-31",
            "scope":"STANDALONE","sourceUrl":u,"sha256":d,"page":0,"pages":len(pdf),
            "originalRevenueCrore":"6709.21","originalProfitCrore":"1086.53",
            "originalEPSDiluted":"12.89","financialFactsAdmitted":0}
          (p/"verified-identity.json").write_text(json.dumps(evidence,indent=2))
          print("R5_CHOLAFIN_DEC2024_SIGNED_STANDALONE_ORIGINAL",json.dumps(evidence))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-cholafin-dec-2024-original-table
          path: tmp/results-r5/nalco-sept-original/*
          if-no-files-found: warn
          retention-days: 2

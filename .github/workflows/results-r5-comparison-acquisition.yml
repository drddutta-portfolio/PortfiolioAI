name: Results R5 Development Historical Comparison Acquisition

on:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r5-comparison-acquisition.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: results-r5-historical-sources-development
  cancel-in-progress: true

jobs:
  acquire-qualify:
    name: Development issuer-original 2025 March June comparison
    runs-on: ubuntu-latest
    timeout-minutes: 230
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
      RESULTS_MAX_STOCKS: "262"
      RESULTS_R5_HISTORICAL_ACK: "2025_MAR_JUN_ONLY"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed on Development credentials and historical scope
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_R2_BUCKET; do
            test -n "${!name:-}" || { echo "MISSING_CONFIGURATION: $name"; exit 1; }
          done
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]] || exit 1
          [[ "$CLOUDFLARE_R2_BUCKET" == portfolioai-history-dev ]] || exit 1
          [[ "$RESULTS_R5_HISTORICAL_ACK" == 2025_MAR_JUN_ONLY ]] || exit 1
      - name: Install pinned source collector
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3==1.40.46' 'psycopg[binary]==3.2.10' 'requests==2.32.5' 'beautifulsoup4==4.13.5'
      - name: Verify historical collector and R4 selector tests
        run: |
          python scripts/results/test_r3_live_public_filing_batch.py -v
          python scripts/results/test_r4_verify_quarterly.py -v
      - name: Optimized quarter-targeted issuer-original recovery for March and June 2025
        env:
          RESULTS_R5_HISTORICAL_ACQUISITION: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/results-r5
          python scripts/results/r3-live-public-filing-batch.py > tmp/results-r5/history-acquisition.json
          python -m json.tool tmp/results-r5/history-acquisition.json > /dev/null
          python - <<'PY'
          import json
          r=json.load(open("tmp/results-r5/history-acquisition.json"))
          assert r["target_period_ends"] == ["2025-03-31","2025-06-30"]
          print(json.dumps({k:r.get(k) for k in ("universe_target","visited","observations_inserted","documents_parsed","blocked")},sort_keys=True))
          PY
      - name: R2 hash verification and canonical current-display source selection
        env:
          RESULTS_R5_COMPARISON_SELECTION: "1"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/results/r4-verify-quarterly.py --apply
          cp tmp/results-r4/readback.json tmp/results-r5/selection-readback.json
          python - <<'PY'
          import json
          r=json.load(open("tmp/results-r5/selection-readback.json"))
          print(json.dumps({k:r.get(k) for k in ("selected_candidate_facts","created_decisions","unchanged_decisions","conflicting_existing_decisions","r2_sources_checked")},sort_keys=True))
          assert r["conflicting_existing_decisions"] == 0
          PY
      - name: Preserve non-secret source acquisition and readback reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-r5-2025-historical-comparisons
          path: tmp/results-r5/*.json
          if-no-files-found: warn
          retention-days: 21

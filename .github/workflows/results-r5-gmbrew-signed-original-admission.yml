name: Results R5 GMBREW Signed March 2025 Historical Source Admission
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r5-gmbrew-signed-original-admission.yml
      - scripts/results/r5-gmbrew-signed-march-original.py
permissions:
  contents: write
concurrency:
  group: results-r5-gmbrew-original-development
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact Development branch and database R2 isolation
        run: |
          test "$GITHUB_REPOSITORY" = "drddutta-portfolio/PortfiolioAI"
          test "$GITHUB_REF" = "refs/heads/PortfolioAI-Development"
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]]
          test "$CLOUDFLARE_R2_BUCKET" = "portfolioai-history-dev"
      - name: Replay signed SHA-locked March issuer original and admit independent GMBREW R5-only trio
        run: |
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'pymupdf==1.26.6' 'requests==2.32.5'
          python scripts/results/r5-gmbrew-signed-march-original.py
          git diff --check
      - name: Pin qualified comparison-only financial observation IDs
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/features/results/resultsR5GMBREWOriginalComparisonProof.json; then
            git config user.name "portfolioai-r5-source-proof"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/results/resultsR5GMBREWOriginalComparisonProof.json
            git commit -m "data(results-r5): pin signed GMBREW March 2025 source original comparison IDs"
            git fetch origin PortfolioAI-Development
            git rebase origin/PortfolioAI-Development
            git push origin HEAD:PortfolioAI-Development
          fi

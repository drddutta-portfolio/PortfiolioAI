name: Results R5 JASH Signed 2024 Original Evidence Replay
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r5-jash-original-source-admission.yml
      - scripts/results/r5-jash-signed-2024-comparison.py
permissions:
  contents: write
concurrency:
  group: results-r5-jash-signed-original-development
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard strict Development environment
        run: |
          test "$GITHUB_REPOSITORY" = "drddutta-portfolio/PortfiolioAI"
          test "$GITHUB_REF" = "refs/heads/PortfolioAI-Development"
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]]
          test "$CLOUDFLARE_R2_BUCKET" = "portfolioai-history-dev"
      - name: Replay exact SHA signed JASH September and December 2024 original trios
        run: |
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'pymupdf==1.26.6' 'requests==2.32.5'
          python scripts/results/r5-jash-signed-2024-comparison.py
          git diff --check
      - name: Publish only verified R5 comparison proof IDs, no canonical edits
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/features/results/resultsR5JASHOriginalComparisonProof.json; then
            git config user.name "portfolioai-r5-source-proof"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/results/resultsR5JASHOriginalComparisonProof.json
            git commit -m "data(results-r5): pin two verified JASH original 2024 consolidated quarter trios"
            git fetch origin PortfolioAI-Development
            git rebase origin/PortfolioAI-Development
            git push origin HEAD:PortfolioAI-Development
          fi

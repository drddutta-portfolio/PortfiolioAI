name: Results R5 Tata Power 2024 Signed Original R2 Proof Replay
on:
  workflow_dispatch:
  push:
    branches: [PortfolioAI-Development]
    paths:
      - .github/workflows/results-r5-tatapower-original-source-admission.yml
      - scripts/results/r5-tatapower-pinned-2024-original.py
permissions:
  contents: write
concurrency:
  group: results-r5-tatapower-original-admission-development
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: portfolioai-history-dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact Development isolation before ANY operation
        run: |
          test "$GITHUB_REPOSITORY" = "drddutta-portfolio/PortfiolioAI"
          test "$GITHUB_REF" = "refs/heads/PortfolioAI-Development"
          [[ "$SUPABASE_DB_URL" == *lrgpjimipfkyoqbpsqzz* ]]
          test "$CLOUDFLARE_R2_BUCKET" = "portfolioai-history-dev"
      - name: Verify R2 SHA pinned visual-issuer originals and register two R5-only 2024 trios
        run: |
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10' 'boto3==1.40.46' 'pymupdf==1.26.6' 'requests==2.32.5'
          python scripts/results/r5-tatapower-pinned-2024-original.py
          git diff --check
      - name: Commit comparison-only source identities if and only if independently verified
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/features/results/resultsR5TataPowerOriginalComparisonProof.json; then
            git config user.name "portfolioai-r5-source-proof"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/results/resultsR5TataPowerOriginalComparisonProof.json
            git commit -m "data(results-r5): pin two signed Tata Power 2024 source-original comparison identities"
            git fetch origin PortfolioAI-Development
            git rebase origin/PortfolioAI-Development
            git push origin HEAD:PortfolioAI-Development
          fi

name: Results Manual Scan V2 Integration Checks
on:
  push:
    branches: [results-scan-v2-dev-rollout-20261107]
    paths:
      - .github/workflows/results-scan-integration-check.yml
      - src/features/results/**
      - scripts/results/results_scan_worker.py
      - scripts/results/results_bse_live_discovery.py
      - scripts/results/test_results_bse_live_discovery.py
      - scripts/results/r3-live-public-filing-batch.py
      - scripts/results/r4-verify-quarterly.py
      - supabase/functions/results-quarterly-scan/**
      - supabase/functions/results-quarterly-scan-v2/**
  workflow_dispatch:
permissions: {contents: read}
jobs:
  scanner-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22',cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --no-audit --no-fund
      - name: Verify UI-to-service button click and Results R5 contract
        run: npx vitest run src/features/results/ResultsLivePage.test.tsx src/features/results/ResultsReferenceLivePage.test.tsx src/features/results/resultsQuarterPeriods.test.ts
      - name: Verify TypeScript and canonical architecture rules
        run: |
          npm run typecheck
          npm run check:architecture
      - name: Lint authenticated scanner edge endpoint
        run: npx eslint --config eslint.edge.config.js supabase/functions/results-quarterly-scan-v2/index.ts
      - name: Syntax-verify live collector, independent verifier, and scan worker
        run: |
          python -m py_compile scripts/results/r3-live-public-filing-batch.py scripts/results/r4-verify-quarterly.py scripts/results/results_scan_worker.py scripts/results/results_bse_live_discovery.py
      - name: Verify existing original-source parser regressions (without live credential)
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'boto3==1.40.46' 'psycopg[binary]==3.2.10' \
            'requests==2.32.5' 'beautifulsoup4==4.13.5'
          python scripts/results/test_r3_live_public_filing_batch.py -v
          python scripts/results/test_results_bse_live_discovery.py -v
      - name: Verify production bundle still builds
        run: npm run build

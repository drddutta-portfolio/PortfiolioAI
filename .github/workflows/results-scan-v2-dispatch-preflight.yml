name: Results Scan V2 Development Dispatch Preflight
on:
  push:
    branches: [results-scan-button-integration-20261107]
    paths:
      - .github/workflows/results-scan-v2-dispatch-preflight.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lrgpjimipfkyoqbpsqzz
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: {version: 2.65.0}
      - name: Verify management access and exact Development project
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = lrgpjimipfkyoqbpsqzz
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "MANAGEMENT_CREDENTIAL_UNAVAILABLE"; exit 2; }
          supabase functions list --project-ref "$PROJECT_REF" --output json > /tmp/functions.json
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/functions.json"))
          if isinstance(data,dict):data=data.get('functions',data.get('data',[]))
          slugs={d.get('slug') or d.get('name') for d in data}
          assert 'results-quarterly-scan' in slugs and 'results-quarterly-scan-v2' in slugs
          print("DEVELOPMENT_EDGE_V2_PRESENT")
          PY
      - name: Confirm GitHub worker dispatch secret without exposing secret values
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets list --project-ref "$PROJECT_REF" --output json > /tmp/secret-metadata.json
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/secret-metadata.json"))
          if isinstance(data,dict):data=data.get("secrets",data.get("data",[]))
          assert isinstance(data,list)
          present='RESULTS_SCAN_GITHUB_CONTENTS_TOKEN' in {x.get('name') for x in data}
          print('RESULTS_SCAN_DISPATCH_SECRET_PRESENT='+str(present).lower())
          PY
      - name: Check repository token candidates are already configured, without exposing values
        shell: bash
        env:
          GH_WORKER_TOKEN: ${{ secrets.RESULTS_SCAN_GITHUB_CONTENTS_TOKEN }}
        run: |
          if [ -n "${GH_WORKER_TOKEN:-}" ]; then
            echo REPOSITORY_DISPATCH_TOKEN_PRESENT=true
          else
            echo REPOSITORY_DISPATCH_TOKEN_PRESENT=false
          fi
